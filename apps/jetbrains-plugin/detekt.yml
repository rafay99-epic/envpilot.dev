build:
  maxIssues: 0
complexity:
  LongMethod:
    threshold: 150
  LongParameterList:
    active: false
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    threshold: 25
  NestedBlockDepth:
    active: false
exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
naming:
  FunctionNaming:
    ignoreAnnotated: ['Test']
style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated: ['Test']
