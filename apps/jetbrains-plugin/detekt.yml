build:
  maxIssues: 0
complexity:
  LongMethod:
    threshold: 150
  LongParameterList:
    active: false
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    threshold: 25
  NestedBlockDepth:
    active: false
exceptions:
  # Boundary catches (actions, network, UI) intentionally catch Exception and
  # report; SwallowedException stays on because a dropped cause is a real bug.
  TooGenericExceptionCaught:
    active: false
naming:
  FunctionNaming:
    ignoreAnnotated: ["Test"]
style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated: ["Test"]
