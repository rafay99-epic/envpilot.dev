name: "Envpilot — Pull Secrets"
description: "Securely pull environment variables from Envpilot into your GitHub Actions workflow"
author: "Envpilot <hello@envpilot.dev>"

branding:
  icon: "lock"
  color: "green"

inputs:
  method:
    description: "Authentication method: 'service-token' or 'oidc'"
    required: true
    default: "service-token"
  service-token:
    description: "Envpilot service token (required when method is 'service-token')"
    required: false
  project-id:
    description: "Envpilot project ID to pull secrets from"
    required: true
  environment:
    description: "Target environment (e.g., development, staging, production)"
    required: true
    default: "production"
  api-url:
    description: "Envpilot API base URL"
    required: false
    default: "https://www.envpilot.dev"
  export-to:
    description: "Where to export secrets: 'env' (environment variables), 'outputs' (step outputs), or 'both'"
    required: false
    default: "env"
  mask-values:
    description: "Whether to mask secret values in logs (strongly recommended)"
    required: false
    default: "true"
  keys:
    description: "Comma-separated list of specific variable keys to pull (empty = all)"
    required: false
    default: ""

outputs:
  session-id:
    description: "The CI/CD session ID (for debugging)"
  variables-count:
    description: "Number of variables pulled and exported"

runs:
  using: "node20"
  main: "dist/main/index.js"
  post: "dist/post/index.js"
  post-if: "always()"
