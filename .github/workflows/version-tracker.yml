name: Version Tracker

# ⛔ DORMANT — and currently running NOWHERE. It moved to CircleCI in
# 2026-07-16, but was dropped from that config during a later refactor, and
# .circleci/ is now deleted entirely. Re-enable the `pull_request` trigger
# here if the PR version-bump reminders are still wanted; workflow_dispatch
# is the manual escape hatch meanwhile.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: version-tracker-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  track-versions:
    name: Track Package Versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout base branch for comparison
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: base

      - name: Read current versions
        id: current
        run: |
          {
            echo "root=$(jq -r '.version' package.json)"
            echo "web=$(jq -r '.version' apps/web/package.json)"
            echo "blog=$(jq -r '.version // "0.0.0"' apps/blog/package.json 2>/dev/null || echo '0.0.0')"
            echo "docs=$(jq -r '.version // "0.0.0"' apps/docs/package.json 2>/dev/null || echo '0.0.0')"
            echo "cli=$(jq -r '.version' apps/cli/package.json)"
            echo "extension=$(jq -r '.version' apps/vscode-extension/package.json)"
            echo "admin=$(jq -r '.version' apps/admin/package.json)"
            echo "action=$(jq -r '.version' packages/github-action/package.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Read base versions
        id: base
        run: |
          {
            echo "root=$(jq -r '.version' base/package.json)"
            echo "web=$(jq -r '.version' base/apps/web/package.json)"
            echo "blog=$(jq -r '.version // "0.0.0"' base/apps/blog/package.json 2>/dev/null || echo '0.0.0')"
            echo "docs=$(jq -r '.version // "0.0.0"' base/apps/docs/package.json 2>/dev/null || echo '0.0.0')"
            echo "cli=$(jq -r '.version' base/apps/cli/package.json)"
            echo "extension=$(jq -r '.version' base/apps/vscode-extension/package.json)"
            echo "admin=$(jq -r '.version // "0.0.0"' base/apps/admin/package.json 2>/dev/null || echo '0.0.0')"
            echo "action=$(jq -r '.version // "0.0.0"' base/packages/github-action/package.json 2>/dev/null || echo '0.0.0')"
          } >> "$GITHUB_OUTPUT"

      - name: Detect version changes and bump types
        id: changes
        run: |
          classify_bump() {
            local base="$1" current="$2"
            if [ "$base" = "$current" ]; then echo "none"; return; fi

            IFS='.' read -r base_major base_minor base_patch <<< "$base"
            IFS='.' read -r cur_major cur_minor cur_patch <<< "$current"

            if [ "$cur_major" -gt "$base_major" ] 2>/dev/null; then echo "major"
            elif [ "$cur_minor" -gt "$base_minor" ] 2>/dev/null; then echo "minor"
            elif [ "$cur_patch" -gt "$base_patch" ] 2>/dev/null; then echo "patch"
            else echo "patch"; fi
          }

          changed=""
          bump_types=""
          summary=""

          root_bump=$(classify_bump "${{ steps.base.outputs.root }}" "${{ steps.current.outputs.root }}")
          web_bump=$(classify_bump "${{ steps.base.outputs.web }}" "${{ steps.current.outputs.web }}")
          blog_bump=$(classify_bump "${{ steps.base.outputs.blog }}" "${{ steps.current.outputs.blog }}")
          docs_bump=$(classify_bump "${{ steps.base.outputs.docs }}" "${{ steps.current.outputs.docs }}")
          cli_bump=$(classify_bump "${{ steps.base.outputs.cli }}" "${{ steps.current.outputs.cli }}")
          ext_bump=$(classify_bump "${{ steps.base.outputs.extension }}" "${{ steps.current.outputs.extension }}")
          admin_bump=$(classify_bump "${{ steps.base.outputs.admin }}" "${{ steps.current.outputs.admin }}")
          action_bump=$(classify_bump "${{ steps.base.outputs.action }}" "${{ steps.current.outputs.action }}")

          if [ "$root_bump" != "none" ]; then
            changed="${changed}root,"
            bump_types="${bump_types}${root_bump},"
            summary="${summary}| **Monorepo** | \`${{ steps.base.outputs.root }}\` | \`${{ steps.current.outputs.root }}\` | :arrow_up: ${root_bump} |\n"
          else
            summary="${summary}| **Monorepo** | \`${{ steps.current.outputs.root }}\` | \`${{ steps.current.outputs.root }}\` | -- |\n"
          fi

          if [ "$web_bump" != "none" ]; then
            changed="${changed}web,"
            bump_types="${bump_types}${web_bump},"
            summary="${summary}| **Web App** | \`${{ steps.base.outputs.web }}\` | \`${{ steps.current.outputs.web }}\` | :arrow_up: ${web_bump} |\n"
          else
            summary="${summary}| **Web App** | \`${{ steps.current.outputs.web }}\` | \`${{ steps.current.outputs.web }}\` | -- |\n"
          fi

          if [ "$blog_bump" != "none" ]; then
            changed="${changed}blog,"
            bump_types="${bump_types}${blog_bump},"
            summary="${summary}| **Blog** | \`${{ steps.base.outputs.blog }}\` | \`${{ steps.current.outputs.blog }}\` | :arrow_up: ${blog_bump} |\n"
          else
            summary="${summary}| **Blog** | \`${{ steps.current.outputs.blog }}\` | \`${{ steps.current.outputs.blog }}\` | -- |\n"
          fi

          if [ "$docs_bump" != "none" ]; then
            changed="${changed}docs,"
            bump_types="${bump_types}${docs_bump},"
            summary="${summary}| **Docs** | \`${{ steps.base.outputs.docs }}\` | \`${{ steps.current.outputs.docs }}\` | :arrow_up: ${docs_bump} |\n"
          else
            summary="${summary}| **Docs** | \`${{ steps.current.outputs.docs }}\` | \`${{ steps.current.outputs.docs }}\` | -- |\n"
          fi

          if [ "$cli_bump" != "none" ]; then
            changed="${changed}cli,"
            bump_types="${bump_types}${cli_bump},"
            summary="${summary}| **CLI** | \`${{ steps.base.outputs.cli }}\` | \`${{ steps.current.outputs.cli }}\` | :arrow_up: ${cli_bump} |\n"
          else
            summary="${summary}| **CLI** | \`${{ steps.current.outputs.cli }}\` | \`${{ steps.current.outputs.cli }}\` | -- |\n"
          fi

          if [ "$ext_bump" != "none" ]; then
            changed="${changed}extension,"
            bump_types="${bump_types}${ext_bump},"
            summary="${summary}| **VS Code Extension** | \`${{ steps.base.outputs.extension }}\` | \`${{ steps.current.outputs.extension }}\` | :arrow_up: ${ext_bump} |\n"
          else
            summary="${summary}| **VS Code Extension** | \`${{ steps.current.outputs.extension }}\` | \`${{ steps.current.outputs.extension }}\` | -- |\n"
          fi

          if [ "$admin_bump" != "none" ]; then
            changed="${changed}admin,"
            bump_types="${bump_types}${admin_bump},"
            summary="${summary}| **Admin Dashboard** | \`${{ steps.base.outputs.admin }}\` | \`${{ steps.current.outputs.admin }}\` | :arrow_up: ${admin_bump} |\n"
          else
            summary="${summary}| **Admin Dashboard** | \`${{ steps.current.outputs.admin }}\` | \`${{ steps.current.outputs.admin }}\` | -- |\n"
          fi

          # GitHub Action: tag-pinned releases (deploy-action publishes +
          # moves the floating v1) — no /api/version manifest entry, bumps
          # are manual and each bump IS a release.
          if [ "$action_bump" != "none" ]; then
            changed="${changed}action,"
            bump_types="${bump_types}${action_bump},"
            summary="${summary}| **GitHub Action** | \`${{ steps.base.outputs.action }}\` | \`${{ steps.current.outputs.action }}\` | :arrow_up: ${action_bump} |\n"
          else
            summary="${summary}| **GitHub Action** | \`${{ steps.current.outputs.action }}\` | \`${{ steps.current.outputs.action }}\` | -- |\n"
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "bump_types=$bump_types" >> "$GITHUB_OUTPUT"
          printf "%b" "$summary" > /tmp/version-summary.txt

      - name: Post PR comment
        # Fork PRs get a read-only token — commenting would fail.
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const summaryRows = fs.readFileSync('/tmp/version-summary.txt', 'utf8').trim();
            const changed = '${{ steps.changes.outputs.changed }}'.replace(/,$/,'');

            let status;
            if (changed === '') {
              status = 'No version bumps detected in this PR.';
            } else {
              const parts = changed.split(',').filter(Boolean);
              status = `Version bumped: **${parts.join('**, **')}**`;
            }

            const body = [
              '## Version Tracker',
              '',
              '| Package | Base | PR | Status |',
              '|---------|------|-----|--------|',
              summaryRows,
              '',
              status,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith('## Version Tracker')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Add semver label to PR
        # Fork PRs get a read-only token — labeling would fail.
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        uses: actions/github-script@v9
        with:
          script: |
            const bumpTypes = '${{ steps.changes.outputs.bump_types }}'.split(',').filter(Boolean);

            const allLabels = {
              'semver:major':      { color: 'e11d48', description: 'PR includes a breaking/major version bump' },
              'semver:minor':      { color: 'f59e0b', description: 'PR includes a minor (feature) version bump' },
              'semver:patch':      { color: '22c55e', description: 'PR includes a patch (fix) version bump' },
            };

            const labelsToAdd = new Set();

            // Semver labels — use the highest bump type across all packages
            if (bumpTypes.includes('major')) labelsToAdd.add('semver:major');
            else if (bumpTypes.includes('minor')) labelsToAdd.add('semver:minor');
            else if (bumpTypes.includes('patch')) labelsToAdd.add('semver:patch');

            if (labelsToAdd.size === 0) return;

            // Ensure labels exist in the repo
            for (const label of labelsToAdd) {
              const meta = allLabels[label];
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                });
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: meta.color,
                  description: meta.description,
                });
              }
            }

            // Remove stale semver labels before adding new ones
            const semverLabels = ['semver:major', 'semver:minor', 'semver:patch'];
            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const label of currentLabels) {
              if (semverLabels.includes(label.name) && !labelsToAdd.has(label.name)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label.name,
                });
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [...labelsToAdd],
            });

      - name: Print version summary
        run: |
          echo "============================="
          echo "  Envpilot Version Report"
          echo "============================="
          echo "  Monorepo:          ${{ steps.current.outputs.root }}"
          echo "  Web App:           ${{ steps.current.outputs.web }}"
          echo "  CLI:               ${{ steps.current.outputs.cli }}"
          echo "  VS Code Extension: ${{ steps.current.outputs.extension }}"
          echo "  Admin Dashboard:   ${{ steps.current.outputs.admin }}"
          echo "============================="
          if [ -n "${{ steps.changes.outputs.changed }}" ]; then
            echo "  Changed: ${{ steps.changes.outputs.changed }}"
            echo "  Bump types: ${{ steps.changes.outputs.bump_types }}"
          else
            echo "  No version changes detected."
          fi
          echo "============================="
