name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  WORKOS_CLIENT_ID: ci-workos-client-id
  WORKOS_API_KEY: ci-workos-api-key
  WORKOS_COOKIE_PASSWORD: 01234567890123456789012345678901
  WORKOS_REDIRECT_URI: http://localhost:3000/callback
  STRIPE_SECRET_KEY: sk_test_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_placeholder
  RESEND_API_KEY: re_placeholder

jobs:
  app:
    name: App (Type/Lint/Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx turbo typecheck --filter=@envpilot/web

      - name: Lint
        run: bunx turbo lint --filter=@envpilot/web

      - name: Build
        run: bunx turbo build --filter=@envpilot/web

  cli:
    name: CLI (Lint/Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx turbo lint --filter=@envpilot/cli

      - name: Build
        run: bunx turbo build --filter=@envpilot/cli

  extension:
    name: VS Code Extension (Type/Lint/Compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx turbo typecheck --filter=envpilot

      - name: Lint
        run: bunx turbo lint --filter=envpilot

      - name: Build
        run: bunx turbo build --filter=envpilot

  format:
    name: Format Check (Prettier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier check
        run: bunx prettier --check .

  react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run react-doctor
        run: bunx -y react-doctor@latest apps/web --yes --offline --fail-on none --score
