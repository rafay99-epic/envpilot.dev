name: CI

# Orchestrator pipeline:
#   changes (path detection) → parallel scoped checks → checks-passed gate
#   → artifact builds → deploys (main only, via reusable workflows) → release
#
# Vercel production deploys (web, admin, blog, docs) run HERE, via the
# reusable deploy-vercel.yml — one path-gated job per project, so a merge
# only deploys the apps it actually touched. Vercel's git auto-deploy is
# fully OFF in every app's vercel.json (`git.deploymentEnabled: false`) —
# prod deploys would otherwise ship twice per merge. Build artifacts
# (CLI tarball, VSIX) are available in the run's Artifacts panel; nothing is
# commented on PRs.

# ✅ ACTIVE — CI/CD runs on GitHub Actions (2026-07-18). Envpilot is now
# open source, so Actions minutes are free; the full pipeline (quality gate
# + per-surface builds + main-only deploys + release) lives here. CircleCI
# is gone — .circleci/ was deleted once the repo went public and Actions
# became free for it.
# The E2E gate stays disabled (see the e2e job's `false &&`).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Literal stubs (not secrets) so PR/fork builds compile without credentials.
  CI: true
  NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  WORKOS_CLIENT_ID: ci-workos-client-id
  WORKOS_API_KEY: ci-workos-api-key
  WORKOS_COOKIE_PASSWORD: "01234567890123456789012345678901"
  WORKOS_REDIRECT_URI: http://localhost:3000/callback
  POLAR_ACCESS_TOKEN: pat_placeholder
  POLAR_WEBHOOK_SECRET: whsec_placeholder
  POLAR_SERVER: sandbox
  RESEND_API_KEY: re_placeholder
  ENVPILOT_SERVER_URL: https://www.envpilot.dev

jobs:
  # ------------------------------------------------------------------
  # Stage 0: what changed?
  # ------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_web: ${{ steps.flags.outputs.run_web }}
      run_blog: ${{ steps.flags.outputs.run_blog }}
      run_docs: ${{ steps.flags.outputs.run_docs }}
      run_admin: ${{ steps.flags.outputs.run_admin }}
      deploy_web: ${{ steps.flags.outputs.deploy_web }}
      deploy_blog: ${{ steps.flags.outputs.deploy_blog }}
      deploy_docs: ${{ steps.flags.outputs.deploy_docs }}
      deploy_admin: ${{ steps.flags.outputs.deploy_admin }}
      run_cli: ${{ steps.flags.outputs.run_cli }}
      run_extension: ${{ steps.flags.outputs.run_extension }}
      run_jetbrains: ${{ steps.flags.outputs.run_jetbrains }}
      run_action: ${{ steps.flags.outputs.run_action }}
      run_docker_image: ${{ steps.flags.outputs.run_docker_image }}
      run_convex: ${{ steps.flags.outputs.run_convex }}
      deploy_convex: ${{ steps.flags.outputs.deploy_convex }}
      seed_features: ${{ steps.filter.outputs.seed_features }}
      seed_tiers: ${{ steps.filter.outputs.seed_tiers }}
      seed_roles: ${{ steps.filter.outputs.seed_roles }}
      any: ${{ steps.flags.outputs.any }}
      root_version: ${{ steps.versions.outputs.root }}
      web_version: ${{ steps.versions.outputs.web }}
      admin_version: ${{ steps.versions.outputs.admin }}
      cli_version: ${{ steps.versions.outputs.cli }}
      ext_version: ${{ steps.versions.outputs.extension }}
      jetbrains_version: ${{ steps.versions.outputs.jetbrains }}
      action_version: ${{ steps.versions.outputs.action }}
      docker_version: ${{ steps.versions.outputs.docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - 'apps/web/**'
            blog:
              - 'apps/blog/**'
            docs:
              - 'apps/docs/**'
            admin:
              - 'apps/admin/**'
            cli:
              - 'apps/cli/**'
            extension:
              - 'apps/vscode-extension/**'
            jetbrains:
              - 'apps/jetbrains-plugin/**'
            action:
              - 'packages/github-action/**'
            docker_image:
              - 'packages/docker-image/**'
            convex:
              - 'convex/**'
            # One filter per seed, so a deploy runs only the seeds whose
            # source data actually moved. seedData.ts feeds two of them
            # (SEED_FEATURES and SEED_ROLES both live there).
            seed_features:
              - 'convex/lib/seedData.ts'
            seed_tiers:
              - 'convex/features/admin/migrations.ts'
            seed_roles:
              - 'convex/lib/seedData.ts'
              - 'convex/lib/roleProfiles.ts'
              - 'convex/lib/capabilities.ts'
            shared:
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'packages/**'
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.prettierignore'
            # Shared runtime code used by every Vercel app. Tooling and CI
            # changes still run checks through `shared`, but do not deploy.
            vercel_shared:
              - 'packages/ui/**'

      - name: Compute run flags
        id: flags
        env:
          WEB: ${{ steps.filter.outputs.web }}
          BLOG: ${{ steps.filter.outputs.blog }}
          DOCS: ${{ steps.filter.outputs.docs }}
          ADMIN: ${{ steps.filter.outputs.admin }}
          CLI: ${{ steps.filter.outputs.cli }}
          EXTENSION: ${{ steps.filter.outputs.extension }}
          JETBRAINS: ${{ steps.filter.outputs.jetbrains }}
          ACTION: ${{ steps.filter.outputs.action }}
          DOCKER_IMAGE: ${{ steps.filter.outputs.docker_image }}
          CONVEX: ${{ steps.filter.outputs.convex }}
          SHARED: ${{ steps.filter.outputs.shared }}
          VERCEL_SHARED: ${{ steps.filter.outputs.vercel_shared }}
        run: |
          bool() { if [ "$1" = "true" ] || [ "$2" = "true" ]; then echo true; else echo false; fi; }

          run_web=$(bool "$WEB" "$SHARED")
          # Broad shared changes rerun checks. Deploy flags below stay scoped
          # to direct app changes and shared runtime UI.
          run_blog=$(bool "$BLOG" "$SHARED")
          run_docs=$(bool "$DOCS" "$SHARED")
          run_admin=$(bool "$ADMIN" "$SHARED")
          deploy_web=$(bool "$WEB" "$VERCEL_SHARED")
          deploy_blog=$(bool "$BLOG" "$VERCEL_SHARED")
          deploy_docs=$(bool "$DOCS" "$VERCEL_SHARED")
          deploy_admin=$(bool "$ADMIN" "$VERCEL_SHARED")
          run_cli=$(bool "$CLI" "$SHARED")
          run_extension=$(bool "$EXTENSION" "$SHARED")
          run_jetbrains=$(bool "$JETBRAINS" "$SHARED")
          run_action=$(bool "$ACTION" "$SHARED")
          run_docker_image=$(bool "$DOCKER_IMAGE" "$SHARED")
          # Shared changes (lockfile, configs) can break convex typecheck,
          # so they re-run the convex CHECK — but only convex/** changes
          # trigger a convex DEPLOY.
          run_convex=$(bool "$CONVEX" "$SHARED")
          deploy_convex="$CONVEX"

          any=false
          for f in "$run_web" "$run_blog" "$run_docs" "$run_admin" "$run_cli" "$run_extension" "$run_jetbrains" "$run_convex" "$run_action" "$run_docker_image"; do
            [ "$f" = "true" ] && any=true
          done

          {
            echo "run_web=$run_web"
            echo "run_blog=$run_blog"
            echo "run_docs=$run_docs"
            echo "run_admin=$run_admin"
            echo "deploy_web=$deploy_web"
            echo "deploy_blog=$deploy_blog"
            echo "deploy_docs=$deploy_docs"
            echo "deploy_admin=$deploy_admin"
            echo "run_cli=$run_cli"
            echo "run_extension=$run_extension"
            echo "run_jetbrains=$run_jetbrains"
            echo "run_action=$run_action"
            echo "run_docker_image=$run_docker_image"
            echo "run_convex=$run_convex"
            echo "deploy_convex=$deploy_convex"
            echo "any=$any"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Change detection"
            echo "| Surface | Check | Deploy |"
            echo "|---------|-------|--------|"
            echo "| Web | $run_web | $deploy_web |"
            echo "| Admin | $run_admin | $deploy_admin |"
            echo "| Blog | $run_blog | $deploy_blog |"
            echo "| Docs | $run_docs | $deploy_docs |"
            echo "| CLI | $run_cli | $run_cli |"
            echo "| Extension | $run_extension | $run_extension |"
            echo "| JetBrains | $run_jetbrains | $run_jetbrains |"
            echo "| Convex | $run_convex | $deploy_convex |"
            echo "| Docker image | $run_docker_image | $run_docker_image |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read package versions
        id: versions
        run: |
          {
            echo "root=$(jq -r '.version' package.json)"
            echo "web=$(jq -r '.version' apps/web/package.json)"
            echo "admin=$(jq -r '.version' apps/admin/package.json)"
            echo "cli=$(jq -r '.version' apps/cli/package.json)"
            echo "extension=$(jq -r '.version' apps/vscode-extension/package.json)"
            echo "jetbrains=$(grep '^pluginVersion=' apps/jetbrains-plugin/gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
            echo "action=$(jq -r '.version' packages/github-action/package.json)"
            echo "docker=$(jq -r '.version' packages/docker-image/package.json)"
          } >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Stage 1: quality checks — ONE consolidated job (minutes diet, 2026-07-12).
  #
  # Previously 8 parallel jobs (format + 6 per-package checks + react-doctor),
  # each billing a rounded-up minute AND paying its own checkout + bun install
  # (~15 billed min per PR push). Consolidated: one job pays setup once and
  # lets Turborepo parallelize internally; the .turbo cache (keyed per-SHA,
  # restored from any prior run) makes unchanged packages replay instantly on
  # re-pushes. Turbo's own hashing provides the change-scoping the per-package
  # `if:` conditions used to — a docs-only push rebuilds nothing.
  # ------------------------------------------------------------------
  checks:
    name: Checks (format, lint, typecheck, build, test)
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'development' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Secret scan (gitleaks)
        # Standing guard: fail the gate if any real credential is committed.
        # Filesystem scan of the working tree (fast); full-history was swept
        # once at open-sourcing. Allowlist for known example strings lives in
        # .gitleaks.toml.
        #
        # Runs BEFORE the Turborepo cache restore and before any build on
        # purpose. gitleaks emits its "file too large" warning while walking
        # the tree, i.e. BEFORE the path allowlist is applied — so restoring
        # .turbo first buried the real result under ten warnings about cache
        # tarballs the scan was always going to ignore anyway.
        #
        # 4 MB, not 2: on a clean checkout exactly one tracked file exceeds
        # 2 MB (a brand PNG), so the old cap bought nothing but a warning
        # saying a file had gone UNSCANNED. Same wall-clock either way.
        run: |
          V=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" | tar xz -C /tmp gitleaks
          /tmp/gitleaks dir . --config .gitleaks.toml --max-target-megabytes 4 --redact --no-banner
      - name: Load development variables from Envpilot
        if: |
          github.event_name == 'pull_request' &&
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/load-env
        with:
          token: ${{ secrets.ENVPILOT_DEV_TOKEN }}
          environment: development
          required: |
            NEXT_PUBLIC_CONVEX_URL
            WORKOS_CLIENT_ID
      - name: Load production variables from Envpilot
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/load-env
        with:
          token: ${{ secrets.ENVPILOT_PROD_TOKEN }}
          environment: production
          required: |
            NEXT_PUBLIC_CONVEX_URL
            WORKOS_CLIENT_ID
      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Prettier check
        run: bunx prettier --check .
      # docker-image is excluded: it is a Go package, and this job has no Go
      # toolchain. Its build, vet and tests run in smoke-docker-image.yml,
      # which is gated on the same path filter and blocks the publish.
      - name: Build, lint, typecheck, test (turbo)
        run: |
          bunx turbo build lint typecheck test --cache-dir=.turbo \
            --filter='!@envpilot/docker-image'
      - name: Typecheck Convex functions
        # CI config adds Node type roots so process.env usage resolves without
        # a Convex deployment. See convex/tsconfig.ci.json.
        run: bunx tsc --noEmit -p convex/tsconfig.ci.json

  # React Doctor lives in its own workflow now (react-doctor.yml). The job
  # here scanned apps/web only, ran on main pushes only, and printed a bare
  # score into the log — no PR comment, no inline findings, no other surface.

  # ------------------------------------------------------------------
  # Stage 2: the gate — the single required status check
  # ------------------------------------------------------------------
  checks-passed:
    name: All checks passed
    needs:
      - changes
      - checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no check failed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq .
          if echo "$RESULTS" | jq -e '[.[] | select(.result == "failure" or .result == "cancelled")] | length > 0' > /dev/null; then
            echo "::error::One or more checks failed."
            exit 1
          fi
          echo "All required checks passed (skipped = not applicable)."

  # ------------------------------------------------------------------
  # Stage 2.5: E2E gate — full Playwright suite against a real backend.
  # Runs on main pushes only (deploys are main-only) and BLOCKS every
  # deploy below: if the suite fails, nothing ships.
  #
  # Requires an isolated e2e Convex deployment + a WorkOS test account,
  # configured as repo secrets (see the guard step for the full list).
  # The job pushes the NEW convex functions to that deployment first, so
  # the suite exercises exactly the code that is about to deploy.
  # ------------------------------------------------------------------
  e2e:
    name: E2E gate (Playwright)
    needs: [changes, checks-passed]
    # ── E2E GATE DISABLED (2026-07-11) ──────────────────────────────────
    # Every gate run drives a cloud Convex dev deployment and the team's
    # free-tier Database I/O quota is exhausted — CI runs were the main
    # burner. Run the suite locally before merging instead
    # (cd apps/web && bunx playwright test).
    #
    # TO RE-ENABLE: replace `false &&` below with nothing. The deploy jobs'
    # `needs.e2e.result` conditions accept 'skipped' OR 'success', so they
    # keep working while this is off, and a FAILING e2e still blocks
    # deploys the moment it's turned back on.
    #
    # Planned replacement: run the suite against a self-hosted local Convex
    # backend in CI (zero cloud quota) — see .frugal-fable/local-e2e/.
    if: |
      false &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      WORKOS_REDIRECT_URI: http://localhost:3000/callback
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-env
        with:
          token: ${{ secrets.ENVPILOT_DEV_TOKEN }}
          environment: development
          required: |
            CONVEX_DEPLOY_KEY
            NEXT_PUBLIC_CONVEX_URL
            WORKOS_API_KEY
            WORKOS_CLIENT_ID
            WORKOS_COOKIE_PASSWORD
            E2E_TEST_EMAIL
            E2E_TEST_PASSWORD
      - uses: ./.github/actions/setup
      # A gate that silently skips is fake safety: the authenticated specs
      # self-skip without credentials and the suite would go green having
      # tested nothing. Fail loudly instead until the variables exist.
      - name: Verify e2e variables are configured
        run: |
          missing=""
          [ -z "$CONVEX_DEPLOY_KEY" ] && missing="$missing CONVEX_DEPLOY_KEY"
          [ -z "$NEXT_PUBLIC_CONVEX_URL" ] && missing="$missing NEXT_PUBLIC_CONVEX_URL"
          [ -z "$WORKOS_API_KEY" ] && missing="$missing WORKOS_API_KEY"
          [ -z "$WORKOS_CLIENT_ID" ] && missing="$missing WORKOS_CLIENT_ID"
          [ -z "$WORKOS_COOKIE_PASSWORD" ] && missing="$missing WORKOS_COOKIE_PASSWORD"
          [ -z "$E2E_TEST_EMAIL" ] && missing="$missing E2E_TEST_EMAIL"
          [ -z "$E2E_TEST_PASSWORD" ] && missing="$missing E2E_TEST_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::E2E gate cannot run — missing Envpilot variables:$missing. Deploys are blocked until they are configured (isolated e2e Convex deployment + WorkOS test account)."
            exit 1
          fi
          echo "All e2e variables present ✓"

      - name: Push convex functions to the e2e deployment
        run: bunx convex deploy --yes

      # The suite runs parallel workers against per-worker fixture projects
      # (support.ts getWorkerProjectSlug). Free-tier caps (max_projects: 3,
      # max_variables_per_project: 50) would block that scale, so the e2e
      # account is provisioned on the pro tier. Idempotent; no-ops when the
      # user hasn't signed in yet or is already pro.
      - name: Ensure the e2e account is on the pro tier
        run: |
          bunx convex run features/admin/e2e:ensureE2EUserPro "{\"email\": \"$E2E_TEST_EMAIL\"}"

      - name: Install Playwright browsers
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      # Test against a PRODUCTION build, not `next dev`: a cold dev server
      # compiles every route on demand on the runner, stretching the suite
      # ~7× (12m vs 1.7m) and widening every timing window — that's what
      # failed the first gate run (transient pre-auth Convex queries +
      # navigation timeouts). `next start` serves prebuilt pages instantly
      # and matches what actually ships.
      - name: Build web app (production)
        working-directory: apps/web
        run: bun run build

      # Parallel workers (pinned in playwright.config.ts: 4 on CI) are safe
      # now that every worker mutates its OWN fixture project — the old
      # serial pin existed because workers contended on one shared project.
      # Retries stay pinned here so a config refactor can't drop them.
      - name: Run Playwright suite
        working-directory: apps/web
        env:
          PLAYWRIGHT_WEB_CMD: bun run start
        run: bunx playwright test --retries=2

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.sha }}
          path: apps/web/playwright-report
          retention-days: 14

  # ------------------------------------------------------------------
  # Stage 3: artifact builds — only after every check is green
  # ------------------------------------------------------------------
  build-cli:
    name: Build CLI tarball
    needs: [changes, checks-passed]
    # main-only (minutes diet): deploys are the only consumer of the artifact;
    # PR compile breakage is already caught by the consolidated checks job.
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.run_cli == 'true'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-env
        with:
          token: ${{ secrets.ENVPILOT_PROD_TOKEN }}
          environment: production
          required: |
            WORKOS_CLIENT_ID
            NEXT_PUBLIC_CONVEX_URL
      - uses: ./.github/actions/setup
      - name: Build CLI
        working-directory: apps/cli
        run: bun run build
      - name: Pack CLI tarball
        working-directory: apps/cli
        run: npm pack
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: envpilot-cli-${{ github.sha }}
          path: apps/cli/*.tgz
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  build-extension:
    name: Build VSIX
    needs: [changes, checks-passed]
    # main-only (minutes diet): see build-cli.
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.run_extension == 'true'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-env
        with:
          token: ${{ secrets.ENVPILOT_PROD_TOKEN }}
          environment: production
          required: |
            ENVPILOT_SERVER_URL
            WORKOS_CLIENT_ID
            NEXT_PUBLIC_CONVEX_URL
      - uses: ./.github/actions/setup
      - name: Build extension
        working-directory: apps/vscode-extension
        run: bun run build
      - name: Package VSIX
        working-directory: apps/vscode-extension
        run: bunx @vscode/vsce package --no-dependencies
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: envpilot-vsix-${{ github.sha }}
          path: apps/vscode-extension/*.vsix
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  build-jetbrains:
    name: Build JetBrains plugin
    needs: [changes, checks-passed]
    if: |
      needs.changes.outputs.run_jetbrains == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'Production' || 'development' }}
    env:
      # Stubs everywhere except main (push or workflow_dispatch), where load-env
      # supplies the real values. A dispatch on main used to fall between the
      # two conditions and fail the embed check with empty values.
      WORKOS_CLIENT_ID: ${{ (github.ref != 'refs/heads/main' || github.event_name == 'pull_request') && 'client_ci_stub' || '' }}
      NEXT_PUBLIC_CONVEX_URL: ${{ (github.ref != 'refs/heads/main' || github.event_name == 'pull_request') && 'https://convex-ci.invalid' || '' }}
      ENVPILOT_SERVER_URL: ${{ (github.ref != 'refs/heads/main' || github.event_name == 'pull_request') && 'https://www.envpilot.dev' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-env
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          token: ${{ secrets.ENVPILOT_PROD_TOKEN }}
          environment: production
          required: |
            ENVPILOT_SERVER_URL
            NEXT_PUBLIC_CONVEX_URL
            WORKOS_CLIENT_ID
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build plugin
        working-directory: apps/jetbrains-plugin
        run: ./gradlew build verifyPlugin
      - name: Verify build-time values are embedded in the jar
        working-directory: apps/jetbrains-plugin
        run: |
          if [ -z "$WORKOS_CLIENT_ID" ]; then
            echo "::error::WORKOS_CLIENT_ID is empty — refusing to ship."
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_CONVEX_URL" ]; then
            echo "::error::NEXT_PUBLIC_CONVEX_URL is empty — refusing to ship."
            exit 1
          fi
          JAR=build/libs/envpilot-$(grep pluginVersion gradle.properties | cut -d= -f2).jar
          if ! unzip -p "$JAR" dev/envpilot/jetbrains/BuildConfig.class | grep -qF "$WORKOS_CLIENT_ID"; then
            echo "::error::BuildConfig does not contain the WorkOS client id — refusing to ship a broken build."
            exit 1
          fi
          if ! unzip -p "$JAR" dev/envpilot/jetbrains/BuildConfig.class | grep -qF "$NEXT_PUBLIC_CONVEX_URL"; then
            echo "::error::BuildConfig does not contain the Convex URL — refusing to ship a broken build."
            exit 1
          fi
          echo "Required build-time values embedded in $JAR ✓"
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: envpilot-jetbrains-${{ github.sha }}
          path: apps/jetbrains-plugin/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  # ------------------------------------------------------------------
  # Stage 4: deploys — main only, fully verified, via reusable workflows.
  #
  # Strict ordering (each arrow is a hard dependency; an e2e or upstream
  # deploy failure blocks everything downstream):
  #
  #   e2e gate → deploy-convex (backend FIRST)
  #            → deploy-cli + deploy-extension (clients call the paths the
  #              backend just deployed)
  #            → deploy-homebrew (formula points at the npm publish)
  #
  # The `!failure() && !cancelled()` guards let a SKIPPED upstream job
  # (surface unchanged) fall through, while a FAILED one still blocks.
  # ------------------------------------------------------------------
  deploy-convex:
    name: Deploy Convex
    needs: [changes, checks-passed, e2e]
    if: |
      !failure() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      needs.changes.outputs.deploy_convex == 'true'
    uses: ./.github/workflows/deploy-convex.yml
    # Each seed runs only when its own source data moved.
    with:
      seed_features: ${{ needs.changes.outputs.seed_features == 'true' }}
      seed_tiers: ${{ needs.changes.outputs.seed_tiers == 'true' }}
      seed_roles: ${{ needs.changes.outputs.seed_roles == 'true' }}
    secrets: inherit

  # ── Vercel prod deploys — ACTIVE (2026-07-18) ──────────────────────
  # One job per Vercel project, all through the same reusable workflow.
  # Each is path-gated by the `changes` job, so a docs-only merge deploys
  # docs and nothing else. Shared UI changes deploy every consumer, while
  # CI and tooling changes run checks without deploying applications.
  #
  # Vercel's own git auto-deploy is fully OFF in every app's vercel.json
  # (`git.deploymentEnabled: false`) — otherwise each merge would ship
  # twice, once from Vercel and once from here.
  #
  # Backend-first ordering: web and admin call Convex functions, so they
  # require deploy-convex. Blog and docs are static MDX sites that never
  # touch Convex, so they deploy in parallel with it.
  deploy-web:
    name: Deploy web (Vercel)
    needs: [changes, checks-passed, e2e, deploy-convex]
    if: |
      !failure() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      needs.changes.outputs.deploy_web == 'true'
    uses: ./.github/workflows/deploy-vercel.yml
    with:
      app: web
    secrets: inherit

  deploy-admin:
    name: Deploy admin (Vercel)
    needs: [changes, checks-passed, e2e, deploy-convex]
    if: |
      !failure() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      needs.changes.outputs.deploy_admin == 'true'
    uses: ./.github/workflows/deploy-vercel.yml
    with:
      app: admin
    secrets: inherit

  deploy-blog:
    name: Deploy blog (Vercel)
    # No deploy-convex dependency: blog.envpilot.dev is static MDX.
    needs: [changes, checks-passed, e2e]
    if: |
      !failure() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      needs.changes.outputs.deploy_blog == 'true'
    uses: ./.github/workflows/deploy-vercel.yml
    with:
      app: blog
    secrets: inherit

  deploy-docs:
    name: Deploy docs (Vercel)
    # No deploy-convex dependency: docs.envpilot.dev is static MDX.
    needs: [changes, checks-passed, e2e]
    if: |
      !failure() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      needs.changes.outputs.deploy_docs == 'true'
    uses: ./.github/workflows/deploy-vercel.yml
    with:
      app: docs
    secrets: inherit

  deploy-cli:
    name: Deploy CLI
    needs: [changes, build-cli, e2e, deploy-convex]
    if: |
      !failure() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      needs.changes.outputs.run_cli == 'true'
    uses: ./.github/workflows/deploy-cli.yml
    with:
      force: false
    secrets: inherit
    permissions:
      contents: write

  deploy-action:
    name: Deploy GitHub Action
    # Backend FIRST (same strict ordering as deploy-cli/deploy-extension):
    # the published action calls /api/v1/secrets → the Convex pull path, so
    # a release that changes both must never ship the action before the
    # backend it talks to. The !failure() guard lets a SKIPPED deploy-convex
    # (no convex changes) fall through, while a FAILED one blocks.
    needs: [changes, checks-passed, e2e, deploy-convex]
    if: |
      !failure() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      needs.changes.outputs.run_action == 'true'
    uses: ./.github/workflows/deploy-action.yml
    secrets: inherit
    permissions:
      contents: read

  # Runs on PRs too — it publishes NOTHING, needs no secrets, and exercises the
  # binary against a localhost stub, so a fork PR can run it safely. This is
  # the job that proves the "works in any base image" claim; unit tests cannot.
  smoke-docker-image:
    name: Smoke Docker image
    needs: [changes, checks-passed]
    if: |
      !failure() && !cancelled() &&
      needs.changes.outputs.run_docker_image == 'true'
    uses: ./.github/workflows/smoke-docker-image.yml
    permissions:
      contents: read

  deploy-docker-image:
    name: Deploy Docker image
    # Backend FIRST, same strict ordering as deploy-cli/deploy-action: the
    # published image reads /api/v1/projects/*/variables and /api/v1/files, so
    # a release changing both must never ship the image before the backend it
    # calls. The !failure() guard lets a SKIPPED deploy-convex (no convex
    # changes) fall through, while a FAILED one blocks.
    needs: [changes, checks-passed, e2e, deploy-convex, smoke-docker-image]
    if: |
      !failure() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      needs.smoke-docker-image.result == 'success' &&
      needs.changes.outputs.run_docker_image == 'true'
    uses: ./.github/workflows/deploy-docker-image.yml
    secrets: inherit
    permissions:
      contents: read
      # GHCR push authenticates with GITHUB_TOKEN — GitHub Packages rejects
      # fine-grained PATs, so this permission is what makes the push possible.
      packages: write

  deploy-extension:
    name: Deploy extension
    needs: [changes, build-extension, e2e, deploy-convex]
    if: |
      !failure() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      needs.changes.outputs.run_extension == 'true'
    uses: ./.github/workflows/deploy-extension.yml
    with:
      force: false
    secrets: inherit
    permissions:
      contents: write

  deploy-jetbrains:
    name: Deploy JetBrains plugin
    needs: [changes, build-jetbrains, deploy-convex]
    if: |
      !failure() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.run_jetbrains == 'true' &&
      (needs.deploy-convex.result == 'success' || needs.deploy-convex.result == 'skipped')
    uses: ./.github/workflows/deploy-jetbrains.yml
    with:
      force: false
    secrets: inherit
    permissions:
      contents: write

  deploy-homebrew:
    name: Deploy Homebrew formula
    needs: [changes, deploy-cli]
    if: |
      !failure() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.run_cli == 'true' &&
      needs.deploy-cli.result == 'success'
    uses: ./.github/workflows/deploy-homebrew.yml
    with:
      version: ${{ needs.changes.outputs.cli_version }}
    secrets: inherit

  # ------------------------------------------------------------------
  # Stage 5: release — aggregate tag + GitHub Release
  # ------------------------------------------------------------------
  release:
    name: GitHub Release
    needs:
      - changes
      - build-cli
      - build-extension
      - e2e
      - deploy-convex
      - deploy-web
      - deploy-admin
      - deploy-blog
      - deploy-docs
      - deploy-cli
      - deploy-extension
      - deploy-jetbrains
      - deploy-homebrew
      - deploy-action
      - deploy-docker-image
    # Skipped deploys (surface unchanged) must not block the release,
    # so check for failure/cancelled explicitly instead of success().
    # A failed e2e gate DOES block the release — nothing shipped.
    # A failed Vercel deploy also blocks: a tagged release must never
    # advertise a revision whose site never reached production.
    #
    # deploy-homebrew is listed in needs only for its status row in the
    # release notes — a failed Homebrew push must NOT block the release.
    # Retry failed Homebrew pushes via workflow_dispatch on that workflow.
    #
    # deploy-action and deploy-docker-image DO block, like the CLI and the
    # extension: both publish a tag consumers pin (@v1, :1), so a release
    # that announced them without the tag having moved would be a lie.
    if: |
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.any == 'true' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      needs.deploy-convex.result != 'failure' &&
      needs.deploy-convex.result != 'cancelled' &&
      needs.deploy-web.result != 'failure' &&
      needs.deploy-web.result != 'cancelled' &&
      needs.deploy-admin.result != 'failure' &&
      needs.deploy-admin.result != 'cancelled' &&
      needs.deploy-blog.result != 'failure' &&
      needs.deploy-blog.result != 'cancelled' &&
      needs.deploy-docs.result != 'failure' &&
      needs.deploy-docs.result != 'cancelled' &&
      needs.deploy-cli.result != 'failure' &&
      needs.deploy-cli.result != 'cancelled' &&
      needs.deploy-extension.result != 'failure' &&
      needs.deploy-extension.result != 'cancelled' &&
      needs.deploy-jetbrains.result != 'failure' &&
      needs.deploy-jetbrains.result != 'cancelled' &&
      needs.deploy-action.result != 'failure' &&
      needs.deploy-action.result != 'cancelled' &&
      needs.deploy-docker-image.result != 'failure' &&
      needs.deploy-docker-image.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          TAG="v${{ needs.changes.outputs.root_version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG="${TAG}+$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_LINE=""
          PR_NUMBER=$(git log -1 --pretty=%s | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
          if [ -n "$PR_NUMBER" ]; then
            PR_TITLE=$(gh pr view "$PR_NUMBER" --json title -q .title 2>/dev/null || true)
            [ -n "$PR_TITLE" ] && PR_LINE="Merged PR: #${PR_NUMBER} — ${PR_TITLE}"
          fi

          status() {
            case "$1" in
              success) echo "✅ deployed" ;;
              skipped) echo "⏭️ no changes" ;;
              *) echo "❔ $1" ;;
            esac
          }

          {
            echo "## Envpilot ${{ steps.tag.outputs.tag }}"
            echo ""
            [ -n "$PR_LINE" ] && echo "$PR_LINE" && echo ""
            echo "| Surface | Version | Status |"
            echo "|---------|---------|--------|"
            echo "| Web | ${{ needs.changes.outputs.web_version }} | $(status '${{ needs.deploy-web.result }}') |"
            echo "| Admin | ${{ needs.changes.outputs.admin_version }} | $(status '${{ needs.deploy-admin.result }}') |"
            echo "| Blog | — | $(status '${{ needs.deploy-blog.result }}') |"
            echo "| Docs | — | $(status '${{ needs.deploy-docs.result }}') |"
            echo "| Convex | — | $(status '${{ needs.deploy-convex.result }}') |"
            echo "| CLI | ${{ needs.changes.outputs.cli_version }} | $(status '${{ needs.deploy-cli.result }}') |"
            echo "| Extension | ${{ needs.changes.outputs.ext_version }} | $(status '${{ needs.deploy-extension.result }}') |"
            echo "| JetBrains | ${{ needs.changes.outputs.jetbrains_version }} | $(status '${{ needs.deploy-jetbrains.result }}') |"
            echo "| Homebrew | ${{ needs.changes.outputs.cli_version }} | $(status '${{ needs.deploy-homebrew.result }}') |"
            echo "| GitHub Action | ${{ needs.changes.outputs.action_version }} | $(status '${{ needs.deploy-action.result }}') |"
            echo "| Docker image | ${{ needs.changes.outputs.docker_version }} | $(status '${{ needs.deploy-docker-image.result }}') |"
            echo ""
            echo "**Install:** \`npm i -g @envpilot/cli\` · \`brew install rafay99-epic/apps/envpilot\` · [Open VSX](https://open-vsx.org/extension/envpilot/envpilot) · [JetBrains Marketplace](https://plugins.jetbrains.com/plugin/33946-envpilot)"
            echo ""
            echo "**Machine surfaces:** \`uses: rafay99-epic/envpilot-action@v1\` · \`docker pull ghcr.io/rafay99-epic/envpilot:1\`"
          } > /tmp/release-body.md
          cat /tmp/release-body.md

      - name: Download CLI artifact
        if: needs.changes.outputs.run_cli == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: envpilot-cli-${{ github.sha }}
          path: release-artifacts

      - name: Download VSIX artifact
        if: needs.changes.outputs.run_extension == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: envpilot-vsix-${{ github.sha }}
          path: release-artifacts

      - name: Download JetBrains plugin artifact
        if: needs.changes.outputs.run_jetbrains == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: envpilot-jetbrains-${{ github.sha }}
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Envpilot ${{ steps.tag.outputs.tag }}
          body_path: /tmp/release-body.md
          generate_release_notes: true
          files: |
            release-artifacts/*.vsix
            release-artifacts/*.tgz
            release-artifacts/*.zip
