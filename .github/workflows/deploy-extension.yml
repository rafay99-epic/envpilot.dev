name: Deploy Extension

# Publishes the VS Code extension to Open VSX (required) and the VS Code
# Marketplace (optional — skipped when VSCODE_MARKETPLACE_TOKEN is unset)
# when the local version is ahead of Open VSX. Called by ci.yml after the
# full verification gate; also dispatchable standalone.

on:
  workflow_call:
    inputs:
      force:
        description: Publish even if the registry version matches
        type: boolean
        required: false
        default: false
    outputs:
      published:
        description: Whether a new version was published
        value: ${{ jobs.publish.outputs.published }}
      version:
        description: The local extension version
        value: ${{ jobs.publish.outputs.version }}
    secrets:
      ENVPILOT_TOKEN:
        required: false
      ENVPILOT_PROD_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if the registry version matches
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: deploy-extension-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish extension
    runs-on: ubuntu-latest
    environment: Production
    outputs:
      published: ${{ steps.guard.outputs.should_publish }}
      version: ${{ steps.guard.outputs.local_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/load-env
        with:
          token: ${{ secrets.ENVPILOT_PROD_TOKEN }}
          environment: production
          required: |
            ENVPILOT_SERVER_URL
            WORKOS_CLIENT_ID
            NEXT_PUBLIC_CONVEX_URL
            SENTRY_EXTENSION_DSN
            OPEN_VSX_TOKEN

      - uses: ./.github/actions/setup

      - name: Compare local version against Open VSX
        id: guard
        run: |
          LOCAL=$(jq -r '.version' apps/vscode-extension/package.json)
          echo "local_version=$LOCAL" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Force publish requested — skipping version guard."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Distinguish 404 (never published → publish) from network errors
          # (fail loudly — never blind-publish or silently skip).
          CODE=$(curl -s -o /tmp/ovsx-body -w '%{http_code}' \
            https://open-vsx.org/api/envpilot/envpilot || echo "000")

          case "$CODE" in
            200) REMOTE=$(jq -r '.version // empty' /tmp/ovsx-body) ;;
            404) REMOTE="" ;;
            *)
              echo "::error::Open VSX lookup failed (HTTP $CODE)."
              exit 1
              ;;
          esac

          if [ -z "$REMOTE" ]; then
            echo "Extension not on Open VSX yet — publishing $LOCAL."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$LOCAL" != "$REMOTE" ] && [ "$(printf '%s\n%s\n' "$REMOTE" "$LOCAL" | sort -V | tail -1)" = "$LOCAL" ]; then
            echo "Local $LOCAL > Open VSX $REMOTE — publishing."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Local $LOCAL is not ahead of Open VSX $REMOTE — skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      # The build-time env MUST be on THIS step, not a separate build step:
      # `vsce package` runs the extension's "vscode:prepublish" script, which
      # RE-BUILDS the bundle (node scripts/build.mjs). Any dist produced earlier
      # is overwritten here, so if these vars aren't present at package time the
      # VSIX ships an EMPTY client id (turbo dropped them before; a plain build
      # step gets wiped by this rebuild). Values from repo secrets; still baked
      # into the shipped artifact at runtime, which is unavoidable.
      - name: Package VSIX
        if: steps.guard.outputs.should_publish == 'true'
        working-directory: apps/vscode-extension
        run: bunx @vscode/vsce package --no-dependencies

      # Verify the PACKAGED VSIX (the exact bytes we publish), not an
      # intermediate dist that vsce's prepublish rebuild would have replaced.
      # Fail the publish if either secret isn't in it, so a broken extension can
      # NEVER reach the marketplace again. Both matter: an empty client id breaks
      # sign-in; an empty Convex URL leaves getConvexUrl() blank and breaks sync.
      - name: Verify build-time secrets are embedded in the VSIX
        if: steps.guard.outputs.should_publish == 'true'
        working-directory: apps/vscode-extension
        run: |
          if [ -z "$WORKOS_CLIENT_ID" ]; then
            echo "::error::WORKOS_CLIENT_ID secret is empty — refusing to publish."
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_CONVEX_URL" ]; then
            echo "::error::NEXT_PUBLIC_CONVEX_URL secret is empty — refusing to publish."
            exit 1
          fi
          VSIX="envpilot-$(jq -r '.version' package.json).vsix"
          if [ ! -f "$VSIX" ]; then
            echo "::error::Expected package $VSIX not found."
            exit 1
          fi
          BUNDLE=$(unzip -p "$VSIX" extension/dist/extension.js)
          if ! printf '%s' "$BUNDLE" | grep -qF "$WORKOS_CLIENT_ID"; then
            echo "::error::Packaged $VSIX does not contain the WorkOS client id — refusing to publish a broken build."
            exit 1
          fi
          if ! printf '%s' "$BUNDLE" | grep -qF "$NEXT_PUBLIC_CONVEX_URL"; then
            echo "::error::Packaged $VSIX does not contain the Convex URL — refusing to publish a broken build."
            exit 1
          fi
          echo "WorkOS client id + Convex URL embedded in $VSIX ✓"

      - name: Publish to Open VSX
        if: steps.guard.outputs.should_publish == 'true'
        working-directory: apps/vscode-extension
        run: bunx ovsx publish envpilot-*.vsix -p "$OPEN_VSX_TOKEN"

      - name: Publish to VS Code Marketplace (optional)
        if: steps.guard.outputs.should_publish == 'true'
        continue-on-error: true
        working-directory: apps/vscode-extension
        run: |
          if [ -z "${VSCODE_MARKETPLACE_TOKEN:-}" ]; then
            echo "VSCODE_MARKETPLACE_TOKEN is not configured — skipping optional Marketplace publish."
            exit 0
          fi
          bunx @vscode/vsce publish --no-dependencies \
            --packagePath envpilot-*.vsix \
            -p "$VSCODE_MARKETPLACE_TOKEN"

      - name: Tag extension release
        if: steps.guard.outputs.should_publish == 'true'
        run: |
          TAG="extension-v${{ steps.guard.outputs.local_version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
