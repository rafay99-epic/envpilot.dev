name: Deploy Extension

# Publishes the VS Code extension to Open VSX (required) and the VS Code
# Marketplace (optional — skipped when VSCODE_MARKETPLACE_TOKEN is unset)
# when the local version is ahead of Open VSX. Called by ci.yml after the
# full verification gate; also dispatchable standalone.

on:
  workflow_call:
    inputs:
      force:
        description: Publish even if the registry version matches
        type: boolean
        required: false
        default: false
    outputs:
      published:
        description: Whether a new version was published
        value: ${{ jobs.publish.outputs.published }}
      version:
        description: The local extension version
        value: ${{ jobs.publish.outputs.version }}
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if the registry version matches
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: deploy-extension-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish extension
    runs-on: ubuntu-latest
    env:
      # secrets context is not allowed in step-level `if`, so surface
      # token presence here for the optional Marketplace publish.
      HAS_MARKETPLACE_TOKEN: ${{ secrets.VSCODE_MARKETPLACE_TOKEN != '' }}
    outputs:
      published: ${{ steps.guard.outputs.should_publish }}
      version: ${{ steps.guard.outputs.local_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Compare local version against Open VSX
        id: guard
        run: |
          LOCAL=$(jq -r '.version' apps/vscode-extension/package.json)
          echo "local_version=$LOCAL" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Force publish requested — skipping version guard."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Distinguish 404 (never published → publish) from network errors
          # (fail loudly — never blind-publish or silently skip).
          CODE=$(curl -s -o /tmp/ovsx-body -w '%{http_code}' \
            https://open-vsx.org/api/envpilot/envpilot || echo "000")

          case "$CODE" in
            200) REMOTE=$(jq -r '.version // empty' /tmp/ovsx-body) ;;
            404) REMOTE="" ;;
            *)
              echo "::error::Open VSX lookup failed (HTTP $CODE)."
              exit 1
              ;;
          esac

          if [ -z "$REMOTE" ]; then
            echo "Extension not on Open VSX yet — publishing $LOCAL."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$LOCAL" != "$REMOTE" ] && [ "$(printf '%s\n%s\n' "$REMOTE" "$LOCAL" | sort -V | tail -1)" = "$LOCAL" ]; then
            echo "Local $LOCAL > Open VSX $REMOTE — publishing."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Local $LOCAL is not ahead of Open VSX $REMOTE — skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build extension
        if: steps.guard.outputs.should_publish == 'true'
        run: bunx turbo build --filter=envpilot
        env:
          ENVPILOT_SERVER_URL: https://www.envpilot.dev
          # DSNs are publishable identifiers, not secrets. Baked into the
          # bundle at build time (esbuild define) — without this the published
          # extension ships with Sentry disabled.
          SENTRY_EXTENSION_DSN: https://24f72269c7fbd01271c7df8c6bd50744@o4509762173009920.ingest.de.sentry.io/4511055962505296

      - name: Package VSIX
        if: steps.guard.outputs.should_publish == 'true'
        working-directory: apps/vscode-extension
        run: bunx @vscode/vsce package --no-dependencies

      - name: Publish to Open VSX
        if: steps.guard.outputs.should_publish == 'true'
        working-directory: apps/vscode-extension
        run: bunx ovsx publish envpilot-*.vsix -p "${{ secrets.OPEN_VSX_TOKEN }}"

      - name: Publish to VS Code Marketplace (optional)
        if: steps.guard.outputs.should_publish == 'true' && env.HAS_MARKETPLACE_TOKEN == 'true'
        continue-on-error: true
        working-directory: apps/vscode-extension
        run: |
          bunx @vscode/vsce publish --no-dependencies \
            --packagePath envpilot-*.vsix \
            -p "${{ secrets.VSCODE_MARKETPLACE_TOKEN }}"

      - name: Tag extension release
        if: steps.guard.outputs.should_publish == 'true'
        run: |
          TAG="extension-v${{ steps.guard.outputs.local_version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
