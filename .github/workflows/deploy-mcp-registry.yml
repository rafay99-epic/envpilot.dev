name: Deploy MCP Registry Listing

# Publishes server.json to the official MCP registry
# (registry.modelcontextprotocol.io).
#
# Why this matters more than it looks: the registry feeds VS Code's MCP
# gallery and is ingested by third-party directories, and those listings are
# what an assistant retrieves when someone asks how to manage environment
# variables. Being absent from them is why Envpilot never gets named.
#
# No ordering dependency on deploy-convex, unlike the CLI, extension and
# action: the listing contains a URL and a description, not a client that
# calls a backend contract.
#
# Registry versions are IMMUTABLE. The publish step therefore runs only when
# server.json's version differs from what is already listed, so a re-run or an
# unrelated merge cannot fail the pipeline.

on:
  workflow_call:
    secrets:
      ENVPILOT_PROD_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mcp-registry-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish server.json
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-env
        with:
          token: ${{ secrets.ENVPILOT_PROD_TOKEN }}
          environment: production
          required: MCP_REGISTRY_PRIVATE_KEY

      - name: Verify the signing key is configured
        run: |
          if [ -z "$MCP_REGISTRY_PRIVATE_KEY" ]; then
            echo "::error::MCP_REGISTRY_PRIVATE_KEY is missing. Add the ed25519 private key (hex) for the envpilot.dev DNS namespace to the Envpilot production environment. The matching TXT record on envpilot.dev must read: v=MCPv1; k=ed25519; p=<base64 public key>"
            exit 1
          fi

      - name: Read the declared version
        id: meta
        run: |
          VERSION=$(jq -r '.version' server.json)
          NAME=$(jq -r '.name' server.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Declared: $NAME@$VERSION"

      - name: Skip when this version is already listed
        id: check
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Registry entries nest the server under `.server`, and the match
          # has to be for THIS exact version rather than the newest one:
          # versions are immutable, so republishing any already-listed
          # version fails.
          #
          # Tolerant by design. If the registry cannot be read, fall through
          # to the publish, which fails loudly on a duplicate rather than
          # silently doing nothing.
          ENCODED=$(jq -rn --arg n "$NAME" '$n|@uri')
          BODY=$(curl -sS --max-time 20 \
            "https://registry.modelcontextprotocol.io/v0.1/servers?search=${ENCODED}" || echo "")
          MATCH=$(printf '%s' "$BODY" | jq -r --arg n "$NAME" --arg v "$VERSION" '
            [ .servers[]? | (.server // .) | select(.name == $n and .version == $v) ] | length
          ' 2>/dev/null || echo 0)
          if [ "${MATCH:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already listed. Bump server.json to publish a new version."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is not listed yet."
          fi

      - name: Install mcp-publisher
        if: steps.check.outputs.skip != 'true'
        env:
          # Pinned release AND pinned content digest. This job holds the
          # ed25519 key that authorizes publishes for the envpilot.dev
          # namespace, so a tampered release asset would be a key
          # compromise, not just a bad build. Bump both together; the digest
          # comes from the release asset's own `digest` field.
          PUBLISHER_VERSION: v1.8.7
          PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
        run: |
          set -euo pipefail
          ASSET=mcp-publisher_linux_amd64.tar.gz
          curl -sSfL -o "/tmp/${ASSET}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/${ASSET}"
          echo "${PUBLISHER_SHA256}  /tmp/${ASSET}" | sha256sum -c -
          tar xzf "/tmp/${ASSET}" -C /tmp mcp-publisher
          /tmp/mcp-publisher --version

      - name: Publish
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # The key goes on the command line because that is the only
          # interface mcp-publisher offers: `--private-key` is the single
          # source, with no env-var or file alternative (cmd/publisher/
          # commands/login.go). It is read from the environment rather than
          # interpolated into the script, which is already stricter than the
          # upstream example, but it is still visible in the process list for
          # the life of the call. Acceptable only because a GitHub-hosted
          # runner is ephemeral and runs nothing else.
          /tmp/mcp-publisher login dns \
            --domain envpilot.dev \
            --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          /tmp/mcp-publisher publish
