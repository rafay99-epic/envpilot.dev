name: Build CLI Binaries

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: build-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: bun-darwin-arm64
            os: macos-latest
            binary: envpilot-darwin-arm64
          - target: bun-darwin-x64
            os: macos-latest
            binary: envpilot-darwin-x64
          - target: bun-windows-x64
            os: windows-latest
            binary: envpilot-windows-x64.exe
          - target: bun-linux-x64
            os: ubuntu-latest
            binary: envpilot-linux-x64
          - target: bun-linux-arm64
            os: ubuntu-latest
            binary: envpilot-linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bunx turbo build --filter=@envpilot/cli

      - name: Compile binary
        run: bun build apps/cli/dist/index.js --compile --target=${{ matrix.target }} --outfile ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}
          retention-days: 14

  bundle-all:
    name: Bundle All Binaries
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Generate checksums
        working-directory: binaries
        run: shasum -a 256 envpilot-* > checksums.txt

      - name: List binaries
        working-directory: binaries
        run: ls -lh

      - name: Upload all binaries bundle
        uses: actions/upload-artifact@v4
        with:
          name: envpilot-cli-all-${{ github.sha }}
          path: binaries/
          retention-days: 14

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cli-build
          message: |
            ## 🔧 CLI Binaries Ready

            **[Download artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})**  — scroll to "Artifacts" at the bottom.

            | Platform | Artifact |
            |----------|----------|
            | macOS (Apple Silicon) | `envpilot-darwin-arm64` |
            | macOS (Intel) | `envpilot-darwin-x64` |
            | Linux (x64) | `envpilot-linux-x64` |
            | Linux (ARM64) | `envpilot-linux-arm64` |
            | Windows (x64) | `envpilot-windows-x64.exe` |

            **Install (macOS/Linux):**
            ```bash
            # Download and unzip, then:
            chmod +x envpilot-darwin-arm64
            sudo mv envpilot-darwin-arm64 /usr/local/bin/envpilot
            ```
