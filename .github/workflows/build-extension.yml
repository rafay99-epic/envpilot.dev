name: Build VS Code Extension

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-vsix:
    name: Build & Package VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx turbo typecheck --filter=envpilot

      - name: Lint
        run: bunx turbo lint --filter=envpilot

      - name: Build extension
        run: bunx turbo build --filter=envpilot
        env:
          ENVPILOT_SERVER_URL: https://www.envpilot.dev

      - name: Package VSIX
        working-directory: apps/vscode-extension
        run: npx @vscode/vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: envpilot-vsix-${{ github.sha }}
          path: apps/vscode-extension/*.vsix
          retention-days: 7
          if-no-files-found: error
