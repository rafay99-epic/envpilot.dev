name: Build VS Code Extension

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: build-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-vsix:
    name: Build & Package VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build extension
        run: bunx turbo build --filter=envpilot
        env:
          ENVPILOT_SERVER_URL: https://www.envpilot.dev

      - name: Package VSIX
        working-directory: apps/vscode-extension
        run: npx @vscode/vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: envpilot-vsix-${{ github.sha }}
          path: apps/vscode-extension/*.vsix
          retention-days: 7
          if-no-files-found: error

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: extension-build
          message: |
            ## 🧩 VS Code Extension Ready

            **[Download VSIX](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})**  — scroll to "Artifacts" at the bottom.

            **Install:**
            ```bash
            # Download and unzip, then:
            code --install-extension envpilot-*.vsix
            ```
