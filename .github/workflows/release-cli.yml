name: Release CLI

on:
  push:
    branches:
      - main
    paths:
      - "apps/cli/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip npm publish)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────
  # 1. Detect whether a new version needs to be published
  # ──────────────────────────────────────────────────────────
  detect:
    name: Detect version change
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.compare.outputs.should_publish }}
      local_version: ${{ steps.compare.outputs.local_version }}
      npm_version: ${{ steps.compare.outputs.npm_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare local vs npm version
        id: compare
        run: |
          LOCAL_VERSION=$(jq -r '.version' apps/cli/package.json)
          echo "local_version=${LOCAL_VERSION}" >> "$GITHUB_OUTPUT"

          # Fetch the latest published version from npm (returns empty if unpublished)
          NPM_VERSION=$(npm view @envpilot/cli version 2>/dev/null || echo "")
          echo "npm_version=${NPM_VERSION:-unpublished}" >> "$GITHUB_OUTPUT"

          if [ "$LOCAL_VERSION" = "$NPM_VERSION" ]; then
            echo "Version ${LOCAL_VERSION} is already published — skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version detected: ${NPM_VERSION:-unpublished} → ${LOCAL_VERSION}"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────────────────────
  # 2. CI gate — lint, typecheck, and build must pass
  # ──────────────────────────────────────────────────────────
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.should_publish == 'true'
    env:
      # Stub env vars required by the web app build (not used by CLI)
      NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      WORKOS_CLIENT_ID: ci-stub
      WORKOS_API_KEY: ci-stub
      WORKOS_COOKIE_PASSWORD: "01234567890123456789012345678901"
      WORKOS_REDIRECT_URI: http://localhost:3000/callback
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx turbo lint --filter=@envpilot/cli

      - name: Typecheck
        run: bunx turbo typecheck --filter=@envpilot/cli

      - name: Build
        run: bunx turbo build --filter=@envpilot/cli --force

  # ──────────────────────────────────────────────────────────
  # 3. Publish to npm
  # ──────────────────────────────────────────────────────────
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [detect, ci]
    if: needs.detect.outputs.should_publish == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js (npm publish requires Node)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bunx turbo build --filter=@envpilot/cli --force

      - name: Publish to npm
        if: ${{ !(github.event.inputs.dry_run == 'true') }}
        working-directory: apps/cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run — skip publish
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "Dry run — would have published @envpilot/cli@${{ needs.detect.outputs.local_version }}"
          cd apps/cli && npm pack --dry-run

  # ──────────────────────────────────────────────────────────
  # 4. Tag the commit and create a GitHub Release
  # ──────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [detect, publish]
    if: needs.detect.outputs.should_publish == 'true' && !(github.event.inputs.dry_run == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create and push tag
        run: |
          TAG="cli-v${{ needs.detect.outputs.local_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release @envpilot/cli v${{ needs.detect.outputs.local_version }}"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-v${{ needs.detect.outputs.local_version }}
          name: "Envpilot CLI v${{ needs.detect.outputs.local_version }}"
          body: |
            ## @envpilot/cli v${{ needs.detect.outputs.local_version }}

            Published to npm: [`@envpilot/cli@${{ needs.detect.outputs.local_version }}`](https://www.npmjs.com/package/@envpilot/cli/v/${{ needs.detect.outputs.local_version }})

            ### Install

            ```bash
            npm install -g @envpilot/cli
            ```

            ```bash
            bun install -g @envpilot/cli
            ```

            ```bash
            npx @envpilot/cli@${{ needs.detect.outputs.local_version }} login
            ```
          generate_release_notes: true
