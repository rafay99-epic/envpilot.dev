name: Release CLI

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            os: ubuntu-latest
            binary: envpilot-linux-x64
          - target: bun-linux-arm64
            os: ubuntu-latest
            binary: envpilot-linux-arm64
          - target: bun-darwin-arm64
            os: macos-latest
            binary: envpilot-darwin-arm64
          - target: bun-darwin-x64
            os: macos-13
            binary: envpilot-darwin-x64
          - target: bun-windows-x64
            os: windows-latest
            binary: envpilot-windows-x64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bunx turbo build --filter=@envpilot/cli

      - name: Compile binary
        run: bun build apps/cli/dist/index.js --compile --target=${{ matrix.target }} --outfile ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bunx turbo build --filter=@envpilot/cli

      - name: Publish to npm
        working-directory: apps/cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Generate checksums
        working-directory: binaries
        run: shasum -a 256 envpilot-* > checksums.txt

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=cli-v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            VERSION="${GITHUB_REF#refs/tags/cli-v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=cli-v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Envpilot CLI v${{ steps.version.outputs.version }}"
          body: |
            ## Install

            **npm:**
            ```bash
            npm install -g @envpilot/cli
            ```

            **curl (macOS/Linux):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/apps/cli/scripts/install.sh | bash
            ```

            **Manual download:**
            Download the binary for your platform from the assets below.

            | Platform | Binary |
            |----------|--------|
            | macOS (Apple Silicon) | `envpilot-darwin-arm64` |
            | macOS (Intel) | `envpilot-darwin-x64` |
            | Linux (x64) | `envpilot-linux-x64` |
            | Linux (ARM64) | `envpilot-linux-arm64` |
            | Windows (x64) | `envpilot-windows-x64.exe` |
          files: |
            binaries/envpilot-*
            binaries/checksums.txt
          generate_release_notes: true
