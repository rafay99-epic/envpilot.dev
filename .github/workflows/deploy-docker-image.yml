name: Deploy Docker Image

on:
  workflow_call:
    secrets:
      ENVPILOT_TOKEN:
        required: false
      ENVPILOT_PROD_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-docker-image-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish envpilot-docker
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-env
        with:
          token: ${{ secrets.ENVPILOT_PROD_TOKEN }}
          environment: production
          required: DOCKER_PUBLISH_TOKEN
      - uses: ./.github/actions/setup

      - name: Verify publish token is configured
        run: |
          if [ -z "$DOCKER_PUBLISH_TOKEN" ]; then
            echo "::error::DOCKER_PUBLISH_TOKEN is missing — add a fine-grained PAT with Contents read/write on rafay99-epic/envpilot-docker to the Envpilot production environment."
            exit 1
          fi

      - name: Read version
        id: meta
        run: |
          VERSION=$(jq -r '.version' packages/docker-image/package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"
          echo "git_major=v${VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: false

      - name: Vet and test
        working-directory: packages/docker-image
        run: |
          go vet ./...
          go test ./...

      - name: Build binaries
        working-directory: packages/docker-image
        run: ./build.sh

      - name: Verify the binary runs and reports the right version
        working-directory: packages/docker-image
        run: |
          set -euo pipefail
          chmod +x build/linux/amd64/envpilot build/linux/arm64/envpilot
          ACTUAL=$(./build/linux/amd64/envpilot --version)
          EXPECTED="${{ steps.meta.outputs.version }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::binary reports $ACTUAL but package.json says $EXPECTED"
            exit 1
          fi

      - name: Binary exists and is in the build context
        working-directory: packages/docker-image
        run: |
          set -euo pipefail
          for ARCH in amd64 arm64; do
            F="build/linux/$ARCH/envpilot"
            [ -s "$F" ] || { echo "::error::$F is missing or empty — bun run build did not produce it"; exit 1; }
            echo "  $F $(du -h "$F" | cut -f1)"
          done
          docker build -q -f - . <<'PROBE' > /dev/null
          FROM scratch
          COPY build/linux/amd64/envpilot /envpilot
          PROBE
          echo "  build context reaches the binary"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: packages/docker-image
          file: packages/docker-image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/rafay99-epic/envpilot:${{ steps.meta.outputs.version }}
            ghcr.io/rafay99-epic/envpilot:${{ steps.meta.outputs.image_major }}

      - name: Publish the source surface to the public repo
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          MAJOR: ${{ steps.meta.outputs.git_major }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${DOCKER_PUBLISH_TOKEN}@github.com/rafay99-epic/envpilot-docker.git" /tmp/public-docker
          cd /tmp/public-docker
          git config user.name "envpilot-release-bot"
          git config user.email "hello@envpilot.dev"

          rm -rf Dockerfile README.md LICENSE
          cp "$GITHUB_WORKSPACE/packages/docker-image/Dockerfile" Dockerfile
          cp "$GITHUB_WORKSPACE/packages/docker-image/README.md" README.md
          cp "$GITHUB_WORKSPACE/packages/docker-image/LICENSE" LICENSE

          if git diff --quiet && git diff --cached --quiet && ! git status --porcelain | grep -q .; then
            echo "No content changes to publish."
          else
            git add -A
            git commit -m "release: v${VERSION}"
            git push origin HEAD
          fi

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists — skipping."
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

          git tag -f "$MAJOR"
          git push -f origin "$MAJOR"

          echo "Published envpilot-docker v${VERSION} (${MAJOR} moved), image ghcr.io/rafay99-epic/envpilot:${VERSION}."
