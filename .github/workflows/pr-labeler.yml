name: Tag PR by scope

on:
  # Temporary PR #175 trigger so the workflow can be tested before it exists
  # on the default branch. Remove this trigger and its conditional checkout
  # after the smoke test passes.
  pull_request:
    types: [synchronize]
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to label
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply scope labels
    if: github.event_name == 'pull_request_target' || github.event.pull_request.number == 175
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR configuration for the pre-merge smoke test
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4

      # Do not check out or execute PR code in a pull_request_target workflow.
      # actions/labeler reads this configuration from the trusted base branch.
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
          pr-number: ${{ github.event.pull_request.number || inputs.pr_number }}
