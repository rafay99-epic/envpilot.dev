name: Smoke Docker Image

# Proves the image actually works, WITHOUT publishing anything.
#
# This is the gate that runs on pull requests. It never logs into a registry,
# never touches production, and needs no secrets — the binary is exercised
# against a throwaway stub API on localhost, so a fork PR can run it too.
#
# What it is really checking is the one claim the whole package makes: that a
# single binary drops into ANY base image. Unit tests cannot prove that; only
# running it inside alpine (musl), python/golang (glibc), distroless and
# scratch can. That claim was false once already — a Bun-compiled binary needs
# a dynamic loader and died with "exec: no such file or directory" in scratch,
# which is exactly what this job now exists to catch.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Build and verify (no publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          # No go.sum: the fetcher uses the standard library only, so there is
          # nothing to download and nothing to cache.
          cache: false

      - name: Vet and test
        working-directory: packages/docker-image
        run: |
          go vet ./...
          go test ./...

      - name: Build binaries
        working-directory: packages/docker-image
        run: ./build.sh

      # Fail here, with a readable message, rather than inside BuildKit. The
      # first CI run died on "failed to compute cache key ... not found",
      # which says nothing about the real cause (a stale .dockerignore had
      # emptied the build context).
      - name: Binary exists and is in the build context
        working-directory: packages/docker-image
        run: |
          set -euo pipefail
          for ARCH in amd64 arm64; do
            F="build/linux/$ARCH/envpilot"
            [ -s "$F" ] || { echo "::error::$F is missing or empty — bun run build did not produce it"; exit 1; }
            echo "  $F $(du -h "$F" | cut -f1)"
          done
          # A file on disk is not the same as a file BuildKit can see. Prove
          # .dockerignore does not exclude it before the real build runs.
          docker build -q -f - . <<'PROBE' > /dev/null
          FROM scratch
          COPY build/linux/amd64/envpilot /envpilot
          PROBE
          echo "  build context reaches the binary"

      - uses: docker/setup-buildx-action@v4

      # --load, not --push. Single platform because the runner is amd64 and a
      # multi-arch manifest cannot be loaded into the local daemon anyway; the
      # arm64 binary is still compiled above, so a cross-compile break is
      # caught before this step.
      - name: Build the image locally
        uses: docker/build-push-action@v7
        with:
          context: packages/docker-image
          file: packages/docker-image/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          build-args: VERSION=smoke
          tags: envpilot-smoke:local

      - name: Version matches package.json
        run: |
          set -euo pipefail
          ACTUAL=$(docker run --rm envpilot-smoke:local --version)
          EXPECTED=$(jq -r '.version' packages/docker-image/package.json)
          [ "$ACTUAL" = "$EXPECTED" ] || {
            echo "::error::image reports $ACTUAL, package.json says $EXPECTED"; exit 1; }

      - name: Start the stub API
        run: |
          nohup bun packages/docker-image/scripts/stub-api.ts > /tmp/stub.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:41777/healthz && exit 0
            sleep 0.2
          done
          echo "::error::stub API never came up"; cat /tmp/stub.log; exit 1

      # THE point of this job. If the binary is not genuinely static, one of
      # these fails and the "works in any base image" promise is a lie.
      - name: Runs in every base image
        run: |
          set -euo pipefail
          # scratch is FIRST and non-negotiable: it has no libc and no dynamic
          # loader, so it is the case that proves the binary is genuinely
          # static. alpine covers musl, the rest cover glibc.
          for BASE in scratch alpine:3 python:3.12-slim golang:1.23 gcr.io/distroless/base-debian12 gcr.io/distroless/static-debian12; do
            echo "── $BASE"
            printf 'FROM %s\nCOPY --from=envpilot-smoke:local /envpilot /usr/local/bin/envpilot\n' "$BASE" \
              > /tmp/Dockerfile.probe
            docker build -q -t "probe:local" -f /tmp/Dockerfile.probe /tmp > /dev/null
            OUT=$(docker run --rm --network host \
              -e ENVPILOT_TOKEN=envpk_smoke \
              -e ENVPILOT_PROJECT=checkout \
              -e ENVPILOT_ENVIRONMENT=production \
              -e ENVPILOT_API_URL=http://127.0.0.1:41777 \
              --entrypoint /usr/local/bin/envpilot probe:local pull --quiet)
            echo "$OUT" | grep -q "DB_URL='postgres" || {
              echo "::error::$BASE did not return the stub variables"; echo "$OUT"; exit 1; }
          done

      - name: exec injects, passes through exit codes and signals
        run: |
          set -euo pipefail
          run() { docker run --rm --network host \
            -e ENVPILOT_TOKEN=envpk_smoke -e ENVPILOT_PROJECT=checkout \
            -e ENVPILOT_ENVIRONMENT=production \
            -e ENVPILOT_API_URL=http://127.0.0.1:41777 \
            --entrypoint /usr/local/bin/envpilot probe-sh:local "$@"; }

          printf 'FROM alpine:3\nCOPY --from=envpilot-smoke:local /envpilot /usr/local/bin/envpilot\n' \
            > /tmp/Dockerfile.sh
          docker build -q -t probe-sh:local -f /tmp/Dockerfile.sh /tmp > /dev/null

          run exec --quiet -- sh -c 'test "$DB_URL" = "postgres://x?a=1&b=2"'
          echo "  injection ok"

          set +e; run exec --quiet -- sh -c 'exit 42'; CODE=$?; set -e
          [ "$CODE" = "42" ] || { echo "::error::exit code was $CODE, expected 42"; exit 1; }
          echo "  exit-code passthrough ok"

          set +e; run exec --quiet -- sh -c 'kill -TERM $$'; CODE=$?; set -e
          [ "$CODE" = "143" ] || { echo "::error::signal exit was $CODE, expected 143"; exit 1; }
          echo "  signal handling ok"

      - name: Refuses a bad credential and a bad invocation
        run: |
          set -euo pipefail

          # Written out in full, deliberately. A helper that interpolated the
          # arguments BEFORE the image name made docker read the first one
          # ("pull") as the image, which failed with exit 125 and was reported
          # as the app returning the wrong code. `docker run` takes its own
          # flags, THEN the image, THEN the command — never reorder that.
          expect_code() {
            local want="$1"; shift
            local label="$1"; shift
            set +e
            "$@"
            local code=$?
            set -e
            # 125/126/127 come from the docker CLI itself (bad invocation,
            # not executable, not found), never from the fetcher. Treat them
            # as a broken test, not as a failing assertion.
            case "$code" in
              125|126|127)
                echo "::error::$label: docker itself failed with $code — the test harness is wrong, not the binary"
                exit 1 ;;
            esac
            [ "$code" = "$want" ] || {
              echo "::error::$label exited $code, expected $want"; exit 1; }
            echo "  $label -> $code"
          }

          expect_code 1 "bad credential" \
            docker run --rm --network host \
              -e ENVPILOT_API_URL=http://127.0.0.1:41777 \
              -e ENVPILOT_TOKEN=wrong \
              -e ENVPILOT_PROJECT=checkout \
              -e ENVPILOT_ENVIRONMENT=production \
              envpilot-smoke:local pull --quiet

          expect_code 2 "missing credential" \
            docker run --rm --network host \
              -e ENVPILOT_API_URL=http://127.0.0.1:41777 \
              -e ENVPILOT_PROJECT=checkout \
              -e ENVPILOT_ENVIRONMENT=production \
              envpilot-smoke:local pull

          expect_code 2 "unknown flag" \
            docker run --rm --network host \
              -e ENVPILOT_API_URL=http://127.0.0.1:41777 \
              -e ENVPILOT_TOKEN=envpk_smoke \
              -e ENVPILOT_PROJECT=checkout \
              -e ENVPILOT_ENVIRONMENT=production \
              envpilot-smoke:local pull --nope

      - name: Secret files land at the right mode
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e ENVPILOT_TOKEN=envpk_smoke -e ENVPILOT_PROJECT=checkout \
            -e ENVPILOT_ENVIRONMENT=production \
            -e ENVPILOT_API_URL=http://127.0.0.1:41777 \
            --entrypoint /bin/sh probe-sh:local -c \
            '/usr/local/bin/envpilot files --dir /tmp/out --quiet \
             && [ "$(stat -c %a /tmp/out/certs/key.pem)" = "400" ] \
             && [ "$(cat /tmp/out/certs/key.pem)" = "SECRT" ]'

      - name: Build-time mount pattern works end to end
        run: |
          set -euo pipefail
          mkdir -p /tmp/bt && printf 'envpk_smoke' > /tmp/bt/token
          cat > /tmp/bt/Dockerfile <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3
          RUN --mount=type=secret,id=envpilot_token \
              --mount=from=envpilot-smoke:local,source=/envpilot,target=/envpilot \
              ENVPILOT_TOKEN_FILE=/run/secrets/envpilot_token \
              ENVPILOT_API_URL=http://127.0.0.1:41777 \
              /envpilot exec --project checkout --env production -- \
                sh -c 'test -n "$DB_URL" && echo "$MSG" > /built'
          EOF
          docker build --network host --secret id=envpilot_token,src=/tmp/bt/token \
            -t buildtime:local -f /tmp/bt/Dockerfile /tmp/bt
          docker run --rm --entrypoint /bin/sh buildtime:local -c 'cat /built' | grep -q 'hello world'

          # The credential must not have survived into the image.
          if docker history --no-trunc buildtime:local | grep -q 'envpk_smoke'; then
            echo "::error::the token leaked into image history"; exit 1
          fi
          if docker run --rm --entrypoint /bin/sh buildtime:local -c 'ls /run/secrets 2>/dev/null'; then
            echo "::error::the secret mount survived into the image"; exit 1
          fi

      - name: Stop the stub
        if: always()
        run: pkill -f stub-api.ts || true
