name: Deploy Vercel app

# Reusable prod deployer for the three Vercel apps (web, blog, docs).
# CURRENTLY DORMANT: the calling jobs in ci.yml are hard-disabled
# (false &&) because web/blog/docs auto-deploy on merge to main via
# Vercel's git integration, with `ignoreCommand: npx turbo-ignore` in
# each vercel.json skipping builds for unchanged apps. Kept intact for
# re-enable (remove the `false &&`s AND turn git.deploymentEnabled.main
# off in the three vercel.json files, or every merge deploys twice).

on:
  workflow_call:
    inputs:
      app:
        description: "App label (web | blog | docs) — used for concurrency + logs"
        required: true
        type: string
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.app }} to Vercel
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-vercel-${{ inputs.app }}
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Verify Vercel secrets exist
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -z "$TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID(_${{ inputs.app }})"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing — create them from the Vercel dashboard (Account Settings → Tokens; project Settings → General for the IDs) or prod deploys of '${{ inputs.app }}' cannot run."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Pull Vercel project settings
        run: npx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (vercel build)
        run: npx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to production
        run: npx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
