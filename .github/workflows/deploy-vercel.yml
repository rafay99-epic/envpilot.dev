name: Deploy Vercel app

# Reusable prod deployer for the four Vercel apps (web, blog, docs, admin).
# ACTIVE: production deploys happen ONLY here. Vercel's git integration is
# fully disabled in every app's vercel.json (`git.deploymentEnabled: false`)
# so a merge never deploys twice.
#
# The deploy uploads SOURCE and lets the build run on Vercel's infra — no
# `vercel build` / `--prebuilt` here on purpose. A runner-side build would
# inherit ci.yml's stub env vars (NEXT_PUBLIC_CONVEX_URL=http://127.0.0.1:3210)
# and bake them into the client bundle. Vercel builds with the project's real
# production env vars.
#
# Deploys run from the repo ROOT: each project's Root Directory (apps/web,
# apps/blog, apps/docs, apps/admin) is applied by Vercel from its own
# settings, and uploading from root keeps workspace packages (packages/ui)
# and convex/ in the build context.

on:
  workflow_call:
    inputs:
      app:
        description: "App label (web | blog | docs | admin) — used for concurrency + logs"
        required: true
        type: string
    secrets:
      ENVPILOT_TOKEN:
        required: false
      ENVPILOT_PROD_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.app }} to Vercel
    runs-on: ubuntu-latest
    environment: Production
    concurrency:
      group: deploy-vercel-${{ inputs.app }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/load-env
        with:
          token: ${{ secrets.ENVPILOT_PROD_TOKEN }}
          environment: production
          required: |
            VERCEL_TOKEN
            VERCEL_ORG_ID

      - name: Resolve Vercel project
        env:
          APP: ${{ inputs.app }}
        run: |
          case "$APP" in
            web) project_id="${VERCEL_PROJECT_ID_WEB:-}" ;;
            admin) project_id="${VERCEL_PROJECT_ID_ADMIN:-}" ;;
            blog) project_id="${VERCEL_PROJECT_ID_BLOG:-}" ;;
            docs) project_id="${VERCEL_PROJECT_ID_DOCS:-}" ;;
            *)
              echo "::error::Unsupported Vercel app '$APP'."
              exit 1
              ;;
          esac

          if [ -z "$project_id" ]; then
            echo "::error::Envpilot did not provide VERCEL_PROJECT_ID_${APP^^}."
            exit 1
          fi

          echo "VERCEL_PROJECT_ID=$project_id" >> "$GITHUB_ENV"

      - name: Deploy to production (build runs on Vercel)
        run: |
          # Pinned CLI: prod deploy behavior must not change under us via
          # a silent @latest bump. Upgrade deliberately.
          npx vercel@56.3.1 deploy --prod --yes --token="$VERCEL_TOKEN"
          echo "${{ inputs.app }} deployed at \`${{ github.sha }}\`." >> "$GITHUB_STEP_SUMMARY"
