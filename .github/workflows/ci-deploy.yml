name: CI / Deploy

# ─────────────────────────────────────────────────────────────
# Unified pipeline: Quality → Build → Detect → Deploy → Release
# Nothing deploys unless lint, typecheck, format, and build pass.
# Replaces: ci.yml, build-extension.yml, deploy-convex.yml,
#           deploy-extension.yml, release-cli.yml
# ─────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip all deployments)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Stubs so the Next.js web build compiles in CI (not real credentials)
  CI: "true"
  NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  WORKOS_CLIENT_ID: ci-workos-client-id
  WORKOS_API_KEY: ci-workos-api-key
  WORKOS_COOKIE_PASSWORD: "01234567890123456789012345678901"
  WORKOS_REDIRECT_URI: http://localhost:3000/callback
  POLAR_ACCESS_TOKEN: pat_placeholder
  POLAR_WEBHOOK_SECRET: whsec_placeholder
  POLAR_SERVER: sandbox
  RESEND_API_KEY: re_placeholder
  ENVPILOT_SERVER_URL: https://www.envpilot.dev

jobs:
  # ──────────────────────────────────────────────────────────
  # STAGE 1: Quality Gate
  # Lint, typecheck, format — must ALL pass before anything
  # builds or deploys. Failure here stops the entire pipeline.
  # ──────────────────────────────────────────────────────────
  quality:
    name: "Quality: Lint / Typecheck / Format"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (all packages)
        run: bunx turbo lint

      - name: Typecheck (all packages)
        run: bunx turbo typecheck

      - name: Format check
        run: bunx prettier --check .

  # ──────────────────────────────────────────────────────────
  # STAGE 2: Build
  # Builds every package, packages the VS Code extension VSIX,
  # and packs the CLI tarball. Artifacts are uploaded for
  # deployment and release attachment.
  # ──────────────────────────────────────────────────────────
  build:
    name: "Build: All Packages + Artifacts"
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all packages
        run: bunx turbo build

      - name: Package VSIX
        working-directory: apps/vscode-extension
        run: bunx @vscode/vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: envpilot-vsix-${{ github.sha }}
          path: apps/vscode-extension/*.vsix
          retention-days: 30
          if-no-files-found: error

      - name: Pack CLI tarball
        working-directory: apps/cli
        run: npm pack

      - name: Upload CLI tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: envpilot-cli-${{ github.sha }}
          path: apps/cli/*.tgz
          retention-days: 30
          if-no-files-found: error

      - name: Comment VSIX link on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: extension-build
          message: |
            ## VS Code Extension Ready

            **[Download VSIX](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})** — scroll to "Artifacts".

            ```bash
            code --install-extension envpilot-*.vsix
            ```

  # ──────────────────────────────────────────────────────────
  # React Doctor (advisory, non-blocking)
  # Runs in parallel with build — never blocks deployment.
  # ──────────────────────────────────────────────────────────
  react-doctor:
    name: "Advisory: React Doctor"
    needs: quality
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run react-doctor
        run: bunx -y react-doctor@latest apps/web --yes --offline --fail-on none --score

  # ──────────────────────────────────────────────────────────
  # STAGE 3: Detect Changes
  # Only runs on main (push or manual dispatch).
  # Determines which packages need deployment and tracks
  # all changed scopes for the release notes.
  # ──────────────────────────────────────────────────────────
  detect:
    name: "Detect: What Changed"
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      deploy_convex: ${{ steps.changes.outputs.deploy_convex }}
      deploy_extension: ${{ steps.changes.outputs.deploy_extension }}
      deploy_cli: ${{ steps.changes.outputs.deploy_cli }}
      changed_web: ${{ steps.changes.outputs.changed_web }}
      changed_admin: ${{ steps.changes.outputs.changed_admin }}
      changed_extension: ${{ steps.changes.outputs.changed_extension }}
      changed_cli: ${{ steps.changes.outputs.changed_cli }}
      ext_version: ${{ steps.changes.outputs.ext_version }}
      cli_version: ${{ steps.changes.outputs.cli_version }}
      web_version: ${{ steps.changes.outputs.web_version }}
      admin_version: ${{ steps.changes.outputs.admin_version }}
      root_version: ${{ steps.changes.outputs.root_version }}
      has_any_change: ${{ steps.changes.outputs.has_any_change }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect path and version changes
        id: changes
        run: |
          # ── Get changed files ──
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual trigger — checking all paths"
            CHANGED_FILES="convex/schema.ts
          apps/vscode-extension/package.json
          apps/cli/package.json
          apps/web/src/app/page.tsx
          apps/admin/src/app/page.tsx"
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)
            else
              CHANGED_FILES=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD)
            fi
          fi

          echo "=== Changed files ==="
          echo "$CHANGED_FILES"
          echo "====================="

          # ── Read all versions ──
          echo "root_version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"
          echo "web_version=$(jq -r '.version' apps/web/package.json)" >> "$GITHUB_OUTPUT"
          echo "admin_version=$(jq -r '.version' apps/admin/package.json)" >> "$GITHUB_OUTPUT"

          EXT_VERSION=$(jq -r '.version' apps/vscode-extension/package.json)
          echo "ext_version=${EXT_VERSION}" >> "$GITHUB_OUTPUT"

          CLI_VERSION=$(jq -r '.version' apps/cli/package.json)
          echo "cli_version=${CLI_VERSION}" >> "$GITHUB_OUTPUT"

          HAS_ANY="false"

          # ── Convex ──
          if echo "$CHANGED_FILES" | grep -q "^convex/"; then
            echo "deploy_convex=true" >> "$GITHUB_OUTPUT"
            echo "✓ Convex changes detected — will deploy"
            HAS_ANY="true"
          else
            echo "deploy_convex=false" >> "$GITHUB_OUTPUT"
            echo "· No Convex changes"
          fi

          # ── Web App ──
          if echo "$CHANGED_FILES" | grep -q "^apps/web/"; then
            echo "changed_web=true" >> "$GITHUB_OUTPUT"
            echo "✓ Web app changes detected"
            HAS_ANY="true"
          else
            echo "changed_web=false" >> "$GITHUB_OUTPUT"
          fi

          # ── Admin ──
          if echo "$CHANGED_FILES" | grep -q "^apps/admin/"; then
            echo "changed_admin=true" >> "$GITHUB_OUTPUT"
            echo "✓ Admin changes detected"
            HAS_ANY="true"
          else
            echo "changed_admin=false" >> "$GITHUB_OUTPUT"
          fi

          # ── VS Code Extension ──
          if echo "$CHANGED_FILES" | grep -q "^apps/vscode-extension/"; then
            echo "changed_extension=true" >> "$GITHUB_OUTPUT"
            echo "✓ Extension files changed"
            HAS_ANY="true"
          else
            echo "changed_extension=false" >> "$GITHUB_OUTPUT"
          fi

          OVSX_VERSION=$(curl -sf "https://open-vsx.org/api/envpilot/envpilot" | jq -r '.version // empty' 2>/dev/null || echo "")
          echo "  Extension: local=${EXT_VERSION} ovsx=${OVSX_VERSION:-unpublished}"

          if [ "$EXT_VERSION" != "$OVSX_VERSION" ] && echo "$CHANGED_FILES" | grep -q "^apps/vscode-extension/"; then
            echo "deploy_extension=true" >> "$GITHUB_OUTPUT"
            echo "✓ Extension deploy: ${OVSX_VERSION:-unpublished} → ${EXT_VERSION}"
          else
            echo "deploy_extension=false" >> "$GITHUB_OUTPUT"
            echo "· Extension already up to date (no deploy)"
          fi

          # ── CLI ──
          if echo "$CHANGED_FILES" | grep -q "^apps/cli/"; then
            echo "changed_cli=true" >> "$GITHUB_OUTPUT"
            echo "✓ CLI files changed"
            HAS_ANY="true"
          else
            echo "changed_cli=false" >> "$GITHUB_OUTPUT"
          fi

          NPM_VERSION=$(curl -sf "https://registry.npmjs.org/@envpilot/cli/latest" | jq -r '.version // empty' 2>/dev/null || echo "")
          echo "  CLI: local=${CLI_VERSION} npm=${NPM_VERSION:-unpublished}"

          if [ "$CLI_VERSION" != "$NPM_VERSION" ] && echo "$CHANGED_FILES" | grep -q "^apps/cli/"; then
            echo "deploy_cli=true" >> "$GITHUB_OUTPUT"
            echo "✓ CLI deploy: ${NPM_VERSION:-unpublished} → ${CLI_VERSION}"
          else
            echo "deploy_cli=false" >> "$GITHUB_OUTPUT"
            echo "· CLI already up to date (no deploy)"
          fi

          echo "has_any_change=${HAS_ANY}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "============================="
          echo "  Deploy Plan"
          echo "============================="
          echo "  Convex:    ${{ steps.changes.outputs.deploy_convex }}"
          echo "  Extension: ${{ steps.changes.outputs.deploy_extension }} (v${{ steps.changes.outputs.ext_version }})"
          echo "  CLI:       ${{ steps.changes.outputs.deploy_cli }} (v${{ steps.changes.outputs.cli_version }})"
          echo ""
          echo "  Scope Changes"
          echo "  Web:       ${{ steps.changes.outputs.changed_web }} (v${{ steps.changes.outputs.web_version }})"
          echo "  Admin:     ${{ steps.changes.outputs.changed_admin }} (v${{ steps.changes.outputs.admin_version }})"
          echo "  Extension: ${{ steps.changes.outputs.changed_extension }} (v${{ steps.changes.outputs.ext_version }})"
          echo "  CLI:       ${{ steps.changes.outputs.changed_cli }} (v${{ steps.changes.outputs.cli_version }})"
          echo "============================="

  # ──────────────────────────────────────────────────────────
  # STAGE 4a: Deploy Convex
  # ──────────────────────────────────────────────────────────
  deploy-convex:
    name: "Deploy: Convex"
    needs: detect
    if: needs.detect.outputs.deploy_convex == 'true' && !(github.event.inputs.dry_run == 'true')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy to Convex
        run: bunx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

  # ──────────────────────────────────────────────────────────
  # STAGE 4b: Deploy VS Code Extension
  # Publishes to VS Code Marketplace (also available in Cursor)
  # and Open VSX Registry (VS Codium, Gitpod, Theia).
  # ──────────────────────────────────────────────────────────
  deploy-extension:
    name: "Deploy: VS Code Extension"
    needs: detect
    if: needs.detect.outputs.deploy_extension == 'true' && !(github.event.inputs.dry_run == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: envpilot-vsix-${{ github.sha }}

      - name: Publish to Open VSX Registry
        run: |
          echo "Publishing to Open VSX Registry..."
          bunx ovsx publish envpilot-*.vsix -p "${{ secrets.OPEN_VSX_TOKEN }}"
          echo "Published: https://open-vsx.org/extension/envpilot/envpilot"

      - name: Publish to VS Code Marketplace
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.VSCODE_MARKETPLACE_TOKEN }}" ]; then
            echo "VSCODE_MARKETPLACE_TOKEN not set — skipping. Add it when Azure DevOps is accessible."
            exit 0
          fi
          echo "Publishing to VS Code Marketplace..."
          bunx @vscode/vsce publish --no-dependencies --packagePath envpilot-*.vsix -p "${{ secrets.VSCODE_MARKETPLACE_TOKEN }}"
          echo "Published (also available in Cursor)"

      - name: Tag extension release
        run: |
          TAG="extension-v${{ needs.detect.outputs.ext_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release VS Code Extension v${{ needs.detect.outputs.ext_version }}"
          git push origin "$TAG"

  # ──────────────────────────────────────────────────────────
  # STAGE 4c: Deploy CLI to npm
  # ──────────────────────────────────────────────────────────
  deploy-cli:
    name: "Deploy: CLI to npm"
    needs: detect
    if: needs.detect.outputs.deploy_cli == 'true' && !(github.event.inputs.dry_run == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bunx turbo build --filter=@envpilot/cli --force

      - name: Publish to npm
        working-directory: apps/cli
        # NPM_CONFIG_TOKEN is the reliable auth path for `bun publish` in CI.
        # The previous ~/.npmrc approach failed because bun does not
        # consistently read it, surfacing as
        # "missing authentication (run 'bunx npm login')".
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag CLI release
        run: |
          TAG="cli-v${{ needs.detect.outputs.cli_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release @envpilot/cli v${{ needs.detect.outputs.cli_version }}"
          git push origin "$TAG"

  # ──────────────────────────────────────────────────────────
  # STAGE 5: Unified Release
  # Creates ONE GitHub Release per merge with a full summary
  # of everything that changed and everything that deployed.
  # Runs after all deploy jobs finish (success or skipped).
  # ──────────────────────────────────────────────────────────
  release:
    name: "Release"
    needs: [detect, deploy-convex, deploy-extension, deploy-cli]
    if: |
      always() &&
      needs.detect.result == 'success' &&
      needs.detect.outputs.has_any_change == 'true' &&
      !(github.event.inputs.dry_run == 'true') &&
      !contains(needs.deploy-convex.result, 'failure') &&
      !contains(needs.deploy-extension.result, 'failure') &&
      !contains(needs.deploy-cli.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get merged PR info
        id: pr
        run: |
          # Extract PR number from the merge commit message
          PR_NUM=$(git log -1 --pretty=%B | grep -oP '#\K\d+' | head -1 || echo "")

          if [ -n "$PR_NUM" ]; then
            PR_TITLE=$(gh pr view "$PR_NUM" --json title -q '.title' 2>/dev/null || echo "")
            PR_URL=$(gh pr view "$PR_NUM" --json url -q '.url' 2>/dev/null || echo "")
            PR_BODY=$(gh pr view "$PR_NUM" --json body -q '.body' 2>/dev/null || echo "")
            echo "number=${PR_NUM}" >> "$GITHUB_OUTPUT"
            echo "title=${PR_TITLE}" >> "$GITHUB_OUTPUT"
            echo "url=${PR_URL}" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"

            # Write body to file (too large for GITHUB_OUTPUT)
            echo "$PR_BODY" > /tmp/pr-body.txt
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "title=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release tag
        id: tag
        run: |
          ROOT_VERSION="${{ needs.detect.outputs.root_version }}"
          TAG="v${ROOT_VERSION}"

          # If tag already exists, append short SHA to make it unique
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG="v${ROOT_VERSION}+$(git rev-parse --short HEAD)"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build release body
        id: body
        run: |
          PR_FOUND="${{ steps.pr.outputs.found }}"
          PR_URL="${{ steps.pr.outputs.url }}"

          {
            # ── PR reference ──
            if [ "$PR_FOUND" = "true" ]; then
              echo "Merged from PR: ${PR_URL}"
              echo ""
            fi

            # ── Deployment status table ──
            echo "## Deployment Status"
            echo ""
            echo "| Package | Status | Version |"
            echo "|---------|--------|---------|"

            # Convex
            if [ "${{ needs.deploy-convex.result }}" = "success" ]; then
              echo "| **Backend** (Convex) | Deployed | — |"
            elif [ "${{ needs.detect.outputs.deploy_convex }}" = "true" ]; then
              echo "| **Backend** (Convex) | Failed | — |"
            else
              echo "| **Backend** (Convex) | No changes | — |"
            fi

            # Web
            if [ "${{ needs.detect.outputs.changed_web }}" = "true" ]; then
              echo "| **Web App** | Changed (Vercel) | v${{ needs.detect.outputs.web_version }} |"
            else
              echo "| **Web App** | No changes | v${{ needs.detect.outputs.web_version }} |"
            fi

            # Extension
            if [ "${{ needs.deploy-extension.result }}" = "success" ]; then
              echo "| **VS Code Extension** | Published | v${{ needs.detect.outputs.ext_version }} |"
            elif [ "${{ needs.detect.outputs.deploy_extension }}" = "true" ]; then
              echo "| **VS Code Extension** | Failed | v${{ needs.detect.outputs.ext_version }} |"
            elif [ "${{ needs.detect.outputs.changed_extension }}" = "true" ]; then
              echo "| **VS Code Extension** | Changed (VSIX attached) | v${{ needs.detect.outputs.ext_version }} |"
            else
              echo "| **VS Code Extension** | No changes | v${{ needs.detect.outputs.ext_version }} |"
            fi

            # CLI
            if [ "${{ needs.deploy-cli.result }}" = "success" ]; then
              echo "| **CLI** | Published to npm | v${{ needs.detect.outputs.cli_version }} |"
            elif [ "${{ needs.detect.outputs.deploy_cli }}" = "true" ]; then
              echo "| **CLI** | Failed | v${{ needs.detect.outputs.cli_version }} |"
            elif [ "${{ needs.detect.outputs.changed_cli }}" = "true" ]; then
              echo "| **CLI** | Changed (tarball attached) | v${{ needs.detect.outputs.cli_version }} |"
            else
              echo "| **CLI** | No changes | v${{ needs.detect.outputs.cli_version }} |"
            fi

            # Admin
            if [ "${{ needs.detect.outputs.changed_admin }}" = "true" ]; then
              echo "| **Admin** | Changed | v${{ needs.detect.outputs.admin_version }} |"
            else
              echo "| **Admin** | No changes | v${{ needs.detect.outputs.admin_version }} |"
            fi

            echo ""

            # ── Install links (only if something was published) ──
            if [ "${{ needs.deploy-extension.result }}" = "success" ] || [ "${{ needs.deploy-cli.result }}" = "success" ]; then
              echo "## Install"
              echo ""
            fi

            if [ "${{ needs.deploy-extension.result }}" = "success" ]; then
              echo "**VS Code / Cursor:**"
              echo '```'
              echo "ext install envpilot.envpilot"
              echo '```'
              echo "- [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=envpilot.envpilot)"
              echo "- [Open VSX Registry](https://open-vsx.org/extension/envpilot/envpilot)"
              echo ""
            fi

            if [ "${{ needs.deploy-cli.result }}" = "success" ]; then
              echo "**CLI:**"
              echo '```bash'
              echo "bun install -g @envpilot/cli"
              echo '```'
              echo "- [npm](https://www.npmjs.com/package/@envpilot/cli/v/${{ needs.detect.outputs.cli_version }})"
              echo ""
            fi

            # ── Artifacts ──
            HAS_ARTIFACTS="false"
            if [ "${{ needs.detect.outputs.changed_extension }}" = "true" ] || [ "${{ needs.detect.outputs.changed_cli }}" = "true" ]; then
              echo "## Artifacts"
              echo ""
              echo "The following build artifacts are attached to this release:"
              echo ""

              if [ "${{ needs.detect.outputs.changed_extension }}" = "true" ]; then
                echo "- **\`envpilot-*.vsix\`** — VS Code extension (install with \`code --install-extension envpilot-*.vsix\`)"
                HAS_ARTIFACTS="true"
              fi

              if [ "${{ needs.detect.outputs.changed_cli }}" = "true" ]; then
                echo "- **\`envpilot-cli-*.tgz\`** — CLI package (install with \`npm install -g envpilot-cli-*.tgz\`)"
                HAS_ARTIFACTS="true"
              fi

              echo ""
            fi

            # ── PR description (if available) ──
            if [ "$PR_FOUND" = "true" ] && [ -s /tmp/pr-body.txt ]; then
              echo "---"
              echo ""
              echo "## PR Description"
              echo ""
              cat /tmp/pr-body.txt
            fi

          } > /tmp/release-body.md

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.tag.outputs.tag }}" -m "Release ${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Download VSIX (if extension changed)
        if: needs.detect.outputs.changed_extension == 'true'
        uses: actions/download-artifact@v4
        with:
          name: envpilot-vsix-${{ github.sha }}
          path: release-artifacts/
        continue-on-error: true

      - name: Download CLI tarball (if CLI changed)
        if: needs.detect.outputs.changed_cli == 'true'
        uses: actions/download-artifact@v4
        with:
          name: envpilot-cli-${{ github.sha }}
          path: release-artifacts/
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "${{ steps.tag.outputs.tag }} — ${{ steps.pr.outputs.title }}"
          body_path: /tmp/release-body.md
          generate_release_notes: true
          files: |
            release-artifacts/*.vsix
            release-artifacts/*.tgz

  # ──────────────────────────────────────────────────────────
  # Dry Run Summary (only on workflow_dispatch with dry_run)
  # ──────────────────────────────────────────────────────────
  dry-run-summary:
    name: "Dry Run Summary"
    needs: detect
    if: github.event.inputs.dry_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Print what would have deployed
        run: |
          echo "============================================"
          echo "  DRY RUN — no deployments were made"
          echo "============================================"
          echo ""
          echo "  Convex:    ${{ needs.detect.outputs.deploy_convex }}"
          echo "  Extension: ${{ needs.detect.outputs.deploy_extension }} (v${{ needs.detect.outputs.ext_version }})"
          echo "  CLI:       ${{ needs.detect.outputs.deploy_cli }} (v${{ needs.detect.outputs.cli_version }})"
          echo "  Web:       ${{ needs.detect.outputs.changed_web }} (v${{ needs.detect.outputs.web_version }})"
          echo "  Admin:     ${{ needs.detect.outputs.changed_admin }} (v${{ needs.detect.outputs.admin_version }})"
          echo ""
          echo "  Remove dry_run to deploy for real."
          echo "============================================"
