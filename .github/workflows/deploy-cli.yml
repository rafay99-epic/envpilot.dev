name: Deploy CLI

# Publishes @envpilot/cli to npm when the local version is ahead of the
# registry. Called by ci.yml after the full verification gate; also
# dispatchable standalone (use force to bypass the version guard).

on:
  workflow_call:
    inputs:
      force:
        description: Publish even if the registry version matches
        type: boolean
        required: false
        default: false
    secrets:
      ENVPILOT_TOKEN:
        required: false
      ENVPILOT_PROD_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if the registry version matches
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: deploy-cli-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/load-env
        with:
          token: ${{ secrets.ENVPILOT_PROD_TOKEN }}
          environment: production
          required: |
            WORKOS_CLIENT_ID
            NEXT_PUBLIC_CONVEX_URL
            SENTRY_CLI_DSN
            NPM_TOKEN

      - uses: ./.github/actions/setup

      - name: Compare local version against npm
        id: guard
        run: |
          LOCAL=$(jq -r '.version' apps/cli/package.json)
          echo "local_version=$LOCAL" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Force publish requested — skipping version guard."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Distinguish 404 (never published → publish) from network/registry
          # errors (fail loudly — never blind-publish or silently skip).
          if REMOTE=$(npm view @envpilot/cli version 2> /tmp/npm-err); then
            :
          elif grep -q 'E404' /tmp/npm-err; then
            REMOTE=""
          else
            echo "::error::npm registry lookup failed (network/registry error):"
            cat /tmp/npm-err
            exit 1
          fi

          if [ -z "$REMOTE" ]; then
            echo "Package not on npm yet — publishing $LOCAL."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$LOCAL" != "$REMOTE" ] && [ "$(printf '%s\n%s\n' "$REMOTE" "$LOCAL" | sort -V | tail -1)" = "$LOCAL" ]; then
            echo "Local $LOCAL > npm $REMOTE — publishing."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Local $LOCAL is not ahead of npm $REMOTE — skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Build the package DIRECTLY (not via `turbo`). Turbo's task runner did
      # not propagate WORKOS_CLIENT_ID / NEXT_PUBLIC_CONVEX_URL into tsup in CI
      # even though they were set on the step and declared in turbo.json — every
      # turbo-built publish shipped an EMPTY client id. A direct `bun run build`
      # embeds them reliably (verified in the guard step below). The CLI has no
      # workspace build deps, so nothing is lost by skipping turbo here.
      - name: Build CLI
        if: steps.guard.outputs.should_publish == 'true'
        working-directory: apps/cli
        run: bun run build

      # Fail the publish if either build-time secret did not make it into the
      # bundle, so a broken build can NEVER reach npm again (the whole reason
      # logins broke). Both matter: an empty client id breaks auth; an empty
      # Convex URL breaks every backend call.
      - name: Verify build-time secrets are embedded
        if: steps.guard.outputs.should_publish == 'true'
        working-directory: apps/cli
        run: |
          if [ -z "$WORKOS_CLIENT_ID" ]; then
            echo "::error::WORKOS_CLIENT_ID secret is empty — refusing to publish."
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_CONVEX_URL" ]; then
            echo "::error::NEXT_PUBLIC_CONVEX_URL secret is empty — refusing to publish."
            exit 1
          fi
          if ! grep -rqF "$WORKOS_CLIENT_ID" dist; then
            echo "::error::Built CLI does not contain the WorkOS client id — refusing to publish a broken build."
            exit 1
          fi
          if ! grep -rqF "$NEXT_PUBLIC_CONVEX_URL" dist; then
            echo "::error::Built CLI does not contain the Convex URL — refusing to publish a broken build."
            exit 1
          fi
          # @envpilot/* workspace packages are PRIVATE and bundled into dist
          # by tsup's noExternal glob. They deliberately live in
          # devDependencies: listing a `workspace:*` private package under
          # dependencies would publish a manifest npm cannot resolve, breaking
          # `npm i -g @envpilot/cli` for everyone. The tradeoff is that a
          # dropped noExternal glob would silently ship a bundle importing a
          # module that does not exist on npm — so assert it here instead.
          # Match module SPECIFIERS only — the bundle legitimately contains
          # the string "@envpilot/cli" in upgrade hints printed to the user.
          # Covers both quote styles and BARE side-effect imports
          # (`import "@envpilot/x"`), which carry no `from` and slipped
          # through a from/require-only pattern.
          SPEC='(from|require\(|import\(|import)[[:space:]]*["'"'"']@envpilot/'
          if grep -rqE "$SPEC" dist; then
            echo "::error::Built CLI still imports an @envpilot/* workspace package — tsup noExternal is not bundling it. Refusing to publish a build that cannot resolve on npm."
            grep -rnE "$SPEC" dist | head -5
            exit 1
          fi
          echo "WorkOS client id + Convex URL embedded, no unbundled workspace imports ✓"

      # --ignore-scripts is CRITICAL: the CLI has "prepublishOnly": "npm run
      # build", so a plain `bun publish` would RE-RUN tsup here — without the
      # WORKOS_CLIENT_ID env that only the Build step above had — overwriting the
      # just-verified bundle with an empty-client-id one. --ignore-scripts
      # publishes the exact dist the guard verified, so what ships == what passed.
      - name: Publish to npm
        if: steps.guard.outputs.should_publish == 'true'
        working-directory: apps/cli
        run: NPM_CONFIG_TOKEN="$NPM_TOKEN" bun publish --ignore-scripts --access public

      - name: Tag CLI release
        if: steps.guard.outputs.should_publish == 'true'
        run: |
          TAG="cli-v${{ steps.guard.outputs.local_version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
