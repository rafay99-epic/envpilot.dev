name: Deploy CLI

# Publishes @envpilot/cli to npm when the local version is ahead of the
# registry. Called by ci.yml after the full verification gate; also
# dispatchable standalone (use force to bypass the version guard).

on:
  workflow_call:
    inputs:
      force:
        description: Publish even if the registry version matches
        type: boolean
        required: false
        default: false
    outputs:
      published:
        description: Whether a new version was published
        value: ${{ jobs.publish.outputs.published }}
      version:
        description: The local CLI version
        value: ${{ jobs.publish.outputs.version }}
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if the registry version matches
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: deploy-cli-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.guard.outputs.should_publish }}
      version: ${{ steps.guard.outputs.local_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Compare local version against npm
        id: guard
        run: |
          LOCAL=$(jq -r '.version' apps/cli/package.json)
          echo "local_version=$LOCAL" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Force publish requested — skipping version guard."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Distinguish 404 (never published → publish) from network/registry
          # errors (fail loudly — never blind-publish or silently skip).
          if REMOTE=$(npm view @envpilot/cli version 2> /tmp/npm-err); then
            :
          elif grep -q 'E404' /tmp/npm-err; then
            REMOTE=""
          else
            echo "::error::npm registry lookup failed (network/registry error):"
            cat /tmp/npm-err
            exit 1
          fi

          if [ -z "$REMOTE" ]; then
            echo "Package not on npm yet — publishing $LOCAL."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$LOCAL" != "$REMOTE" ] && [ "$(printf '%s\n%s\n' "$REMOTE" "$LOCAL" | sort -V | tail -1)" = "$LOCAL" ]; then
            echo "Local $LOCAL > npm $REMOTE — publishing."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Local $LOCAL is not ahead of npm $REMOTE — skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Build the package DIRECTLY (not via `turbo`). Turbo's task runner did
      # not propagate WORKOS_CLIENT_ID / NEXT_PUBLIC_CONVEX_URL into tsup in CI
      # even though they were set on the step and declared in turbo.json — every
      # turbo-built publish shipped an EMPTY client id. A direct `bun run build`
      # embeds them reliably (verified in the guard step below). The CLI has no
      # workspace build deps, so nothing is lost by skipping turbo here.
      - name: Build CLI
        if: steps.guard.outputs.should_publish == 'true'
        working-directory: apps/cli
        run: bun run build
        env:
          # WorkOS AuthKit device-flow client id and the prod Convex deployment
          # URL, baked into the bundle at build time (tsup define, see
          # apps/cli/tsup.config.ts). WITHOUT THESE the published CLI embeds
          # empty strings and `envpilot login` fails with "This CLI build has no
          # WorkOS client id embedded." Stored as repo secrets (kept out of the
          # workflow source and CI logs); note they are still embedded in the
          # published artifact at runtime, which is unavoidable.
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          # DSNs are publishable identifiers, not secrets. Baked into the
          # bundle at build time (tsup define) — without this the published
          # CLI ships with Sentry disabled.
          SENTRY_CLI_DSN: https://24f72269c7fbd01271c7df8c6bd50744@o4509762173009920.ingest.de.sentry.io/4511055962505296

      # Fail the publish if the client id did not make it into the bundle, so a
      # broken build can NEVER reach npm again (the whole reason logins broke).
      - name: Verify WorkOS client id is embedded
        if: steps.guard.outputs.should_publish == 'true'
        working-directory: apps/cli
        env:
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
        run: |
          if [ -z "$WORKOS_CLIENT_ID" ]; then
            echo "::error::WORKOS_CLIENT_ID secret is empty — refusing to publish."
            exit 1
          fi
          if ! grep -rqF "$WORKOS_CLIENT_ID" dist; then
            echo "::error::Built CLI does not contain the WorkOS client id — refusing to publish a broken build."
            exit 1
          fi
          echo "WorkOS client id embedded in CLI bundle ✓"

      # --ignore-scripts is CRITICAL: the CLI has "prepublishOnly": "npm run
      # build", so a plain `bun publish` would RE-RUN tsup here — without the
      # WORKOS_CLIENT_ID env that only the Build step above had — overwriting the
      # just-verified bundle with an empty-client-id one. --ignore-scripts
      # publishes the exact dist the guard verified, so what ships == what passed.
      - name: Publish to npm
        if: steps.guard.outputs.should_publish == 'true'
        working-directory: apps/cli
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish --ignore-scripts --access public

      - name: Tag CLI release
        if: steps.guard.outputs.should_publish == 'true'
        run: |
          TAG="cli-v${{ steps.guard.outputs.local_version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
