name: Deploy Convex

# Called by ci.yml when convex/** changed (strict — shared config changes
# re-run convex checks but never redeploy). workflow_dispatch is the manual
# escape hatch and force-deploys unconditionally.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-convex-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Convex
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Deploy Convex functions
        run: bunx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      # Feature-registry + tier-override seeds MUST follow every deploy so a
      # release that introduces a new gated feature (e.g. cicd_service_tokens)
      # is registered the moment its code is live — otherwise gates resolve
      # to "denied" until someone remembers to seed manually. Both handlers
      # are idempotent upserts, and seed-tier-definitions deliberately never
      # overwrites deployment-specific billing config (polarProductId).
      # ADMIN_SECRET is read from the deployment's own env via the deploy
      # key — no extra GitHub secret to manage. Masked so it never appears
      # in logs.
      # seed-role-registry + migrate-roles keep the dynamic role system in
      # sync on every deploy (system roles synced from code, custom roles
      # insert-only, legacy slugs normalized) — same idempotent upsert model.
      # seed-changelog rides along for the same reason: changelog entries
      # live in code (convex/features/community/changelog/seed.ts), so the
      # website changelog updates the moment a release with new entries
      # deploys — no manual admin-panel step.
      - name: Seed feature registry + tier overrides
        run: |
          # Command substitution strips the trailing newline; no tr — it
          # would corrupt secrets containing spaces. jq encodes the value
          # into JSON safely regardless of quotes/backslashes/newlines.
          ADMIN_SECRET=$(bunx convex env get ADMIN_SECRET)
          if [ -z "$ADMIN_SECRET" ]; then
            echo "::error::ADMIN_SECRET is not set on the production Convex deployment — seeds cannot run"
            exit 1
          fi
          echo "::add-mask::$ADMIN_SECRET"
          for migration in seed-feature-registry seed-tier-features seed-role-registry migrate-roles seed-changelog; do
            echo "Running $migration..."
            bunx convex run features/admin/migrations:runMigration \
              "$(jq -cn --arg secret "$ADMIN_SECRET" --arg name "$migration" '{secret: $secret, name: $name}')"
          done
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
