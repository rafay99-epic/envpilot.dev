version: 2.1

# ═══════════════════════════════════════════════════════════════════════
# PIPELINE v2 — JOB DEFINITIONS (static, reviewable)
#
# This file holds every command and job. It contains NO workflows: the
# `detect` job in config.yml computes which surfaces changed and appends
# a generated `workflows:` section (only the jobs that matter, with
# `requires` chains built to preserve R3 — any failure stops everything
# downstream) before continuing. See config.yml for the full contract.
#
# Quality gate runs on EVERY pipeline. Builds run per changed surface.
# Deploys/publishes exist only on main. CLI + extension build DIRECTLY
# (bun run build, never turbo — turbo silently dropped build-time env
# vars once and shipped a broken CLI; never again).
# ═══════════════════════════════════════════════════════════════════════

# ── Shared literal stubs: branch builds compile without credentials. ──
stub-env: &stub-env
  CI: "true"
  NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  WORKOS_CLIENT_ID: ci-workos-client-id
  WORKOS_API_KEY: ci-workos-api-key
  WORKOS_COOKIE_PASSWORD: "01234567890123456789012345678901"
  WORKOS_REDIRECT_URI: http://localhost:3000/callback
  POLAR_ACCESS_TOKEN: pat_placeholder
  POLAR_WEBHOOK_SECRET: whsec_placeholder
  POLAR_SERVER: sandbox
  RESEND_API_KEY: re_placeholder
  ENVPILOT_SERVER_URL: https://www.envpilot.dev
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_UI: "false"

commands:
  setup-bun:
    description: Install pinned Bun + restore/install workspace deps
    steps:
      - run:
          name: Install Bun (pinned via packageManager)
          # sudo REQUIRED: cimg runs as `circleci`, npm -g writes /usr/local.
          command: |
            BUN_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
            sudo npm install -g "bun@${BUN_VERSION}"
            bun --version && bunx --version
      - restore_cache:
          keys:
            - bun-cache-v1-{{ checksum "bun.lock" }}
            - bun-cache-v1-
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - save_cache:
          key: bun-cache-v1-{{ checksum "bun.lock" }}
          paths: [~/.bun/install/cache]

  require-env:
    description: Fail loudly when a required secret is missing
    parameters:
      names: { type: string }
    steps:
      - run:
          name: Verify required secrets exist
          command: |
            missing=""
            for name in << parameters.names >>; do
              eval "val=\${$name:-}"
              [ -z "$val" ] && missing="$missing $name"
            done
            if [ -n "$missing" ]; then
              echo "ERROR: missing CircleCI project environment variables:$missing"
              echo "Add them in Project Settings → Environment Variables."
              exit 1
            fi
            echo "All required secrets present ✓"

  git-push-auth:
    description: Point origin at an authenticated remote for tag pushes
    steps:
      - run:
          name: Configure git push auth (GITHUB_TOKEN)
          command: |
            git config user.name "envpilot-release-bot"
            git config user.email "hello@envpilot.dev"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/rafay99-epic/envpilot.dev.git"

  vercel-deploy:
    description: Trigger a gated Vercel production deploy (build runs on Vercel)
    parameters:
      project-id-var: { type: string }
      label: { type: string }
    steps:
      - require-env:
          names: VERCEL_TOKEN VERCEL_ORG_ID << parameters.project-id-var >>
      - run:
          name: Deploy << parameters.label >> to Vercel (production)
          # No --prebuilt: the build runs on Vercel's infra (their minutes,
          # not our credits). This job is only the gated trigger — it can't
          # start unless quality + the surface build were green.
          command: |
            eval "export VERCEL_PROJECT_ID=\$<< parameters.project-id-var >>"
            npx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"

jobs:
  # ────────────────────────────────────────────────────────────────────
  # QUALITY GATE — always, every pipeline. No builds: prettier, lint,
  # typecheck (Next route types via `next typegen`), convex typecheck.
  # Red here = nothing else runs, ~3 min to the verdict.
  # ────────────────────────────────────────────────────────────────────
  quality:
    docker:
      - image: cimg/node:22.17
    resource_class: medium
    environment: *stub-env
    steps:
      - checkout
      - setup-bun
      - restore_cache:
          keys:
            - turbo-v2-{{ .Branch }}-
            - turbo-v2-main-
            - turbo-v2-
      - run:
          name: Prettier check
          command: bunx prettier --check .
      - run:
          name: Generate Next.js route types (typegen, no build)
          command: |
            for app in apps/web apps/blog apps/docs; do
              (cd "$app" && bunx next typegen)
            done
      - run:
          name: Lint + typecheck (turbo)
          command: bunx turbo lint typecheck --cache-dir=.turbo --concurrency=4
      - run:
          name: Typecheck Convex functions
          command: bunx tsc --noEmit -p convex/tsconfig.ci.json
      - save_cache:
          key: turbo-v2-{{ .Branch }}-{{ .Revision }}-quality
          paths: [.turbo]

  # ────────────────────────────────────────────────────────────────────
  # PER-SURFACE BUILDS — only generated when that surface changed.
  # ────────────────────────────────────────────────────────────────────
  build-web:
    docker:
      - image: cimg/node:22.17
    # large: a Next build spawns workers per detected host core; medium OOMs.
    resource_class: large
    environment: *stub-env
    steps:
      - checkout
      - setup-bun
      - restore_cache:
          keys:
            - turbo-v2-{{ .Branch }}-
            - turbo-v2-main-
            - turbo-v2-
      - run:
          name: Build web (turbo)
          command: bunx turbo build --filter=@envpilot/web --cache-dir=.turbo
      - save_cache:
          key: turbo-v2-{{ .Branch }}-{{ .Revision }}-web
          paths: [.turbo]

  build-blog:
    docker:
      - image: cimg/node:22.17
    resource_class: large
    environment: *stub-env
    steps:
      - checkout
      - setup-bun
      - restore_cache:
          keys:
            - turbo-v2-{{ .Branch }}-
            - turbo-v2-main-
            - turbo-v2-
      - run:
          name: Build blog (turbo)
          command: bunx turbo build --filter=@envpilot/blog --cache-dir=.turbo
      - save_cache:
          key: turbo-v2-{{ .Branch }}-{{ .Revision }}-blog
          paths: [.turbo]

  build-docs:
    docker:
      - image: cimg/node:22.17
    resource_class: large
    environment: *stub-env
    steps:
      - checkout
      - setup-bun
      - restore_cache:
          keys:
            - turbo-v2-{{ .Branch }}-
            - turbo-v2-main-
            - turbo-v2-
      - run:
          name: Build docs (turbo)
          command: bunx turbo build --filter=@envpilot/docs --cache-dir=.turbo
      - save_cache:
          key: turbo-v2-{{ .Branch }}-{{ .Revision }}-docs
          paths: [.turbo]

  build-admin:
    docker:
      - image: cimg/node:22.17
    resource_class: medium
    environment: *stub-env
    steps:
      - checkout
      - setup-bun
      - restore_cache:
          keys:
            - turbo-v2-{{ .Branch }}-
            - turbo-v2-main-
            - turbo-v2-
      - run:
          name: Build admin (turbo)
          command: bunx turbo build --filter=@envpilot/admin --cache-dir=.turbo
      - save_cache:
          key: turbo-v2-{{ .Branch }}-{{ .Revision }}-admin
          paths: [.turbo]

  build-cli:
    docker:
      - image: cimg/node:22.17
    resource_class: medium
    environment: *stub-env
    steps:
      - checkout
      - setup-bun
      - run:
          name: Build CLI (DIRECT — never turbo)
          working_directory: apps/cli
          command: bun run build
      - run:
          name: CLI unit tests
          working_directory: apps/cli
          command: bun run test

  build-extension:
    docker:
      - image: cimg/node:22.17
    resource_class: medium
    environment: *stub-env
    steps:
      - checkout
      - setup-bun
      - run:
          name: Build extension (DIRECT — never turbo)
          working_directory: apps/vscode-extension
          command: bun run build

  build-action:
    docker:
      - image: cimg/node:22.17
    resource_class: medium
    environment: *stub-env
    steps:
      - checkout
      - setup-bun
      - run:
          name: Build GitHub Action bundle (direct)
          working_directory: packages/github-action
          command: bun run build

  # ────────────────────────────────────────────────────────────────────
  # DEPLOYS — generated ONLY for main pipelines, one per changed surface.
  # Ordering is encoded in the generated `requires` chains: backend
  # (convex) first, then clients; homebrew after the npm publish;
  # release last. Any red job blocks everything downstream of it.
  # ────────────────────────────────────────────────────────────────────
  deploy-convex:
    docker:
      - image: cimg/node:22.17
    resource_class: medium
    steps:
      - checkout
      - require-env:
          names: CONVEX_DEPLOY_KEY
      - setup-bun
      - run:
          name: Deploy Convex functions (production)
          command: bunx convex deploy
      - run:
          name: Seed feature registry + tier overrides + changelog
          # Idempotent upserts; MUST follow every deploy so new gated
          # features register the moment their code is live. ADMIN_SECRET
          # comes from the deployment env via the deploy key — never echoed.
          command: |
            ADMIN_SECRET=$(bunx convex env get ADMIN_SECRET)
            if [ -z "$ADMIN_SECRET" ]; then
              echo "ERROR: ADMIN_SECRET is not set on the production Convex deployment"
              exit 1
            fi
            for migration in seed-feature-registry seed-tier-features seed-role-registry migrate-roles seed-changelog; do
              echo "Running $migration..."
              bunx convex run features/admin/migrations:runMigration \
                "$(jq -cn --arg secret "$ADMIN_SECRET" --arg name "$migration" '{secret: $secret, name: $name}')"
            done

  publish-cli:
    docker:
      - image: cimg/node:22.17
    resource_class: medium
    steps:
      - checkout
      - setup-bun
      - run:
          name: Compare local version against npm
          command: |
            mkdir -p /tmp/ws
            LOCAL=$(jq -r '.version' apps/cli/package.json)
            echo "$LOCAL" > /tmp/ws/cli-version
            if REMOTE=$(npm view @envpilot/cli version 2> /tmp/npm-err); then
              :
            elif grep -q 'E404' /tmp/npm-err; then
              REMOTE=""
            else
              echo "ERROR: npm registry lookup failed:"; cat /tmp/npm-err; exit 1
            fi
            if [ -z "$REMOTE" ] || { [ "$LOCAL" != "$REMOTE" ] && [ "$(printf '%s\n%s\n' "$REMOTE" "$LOCAL" | sort -V | tail -1)" = "$LOCAL" ]; }; then
              echo "Publishing $LOCAL (npm has: ${REMOTE:-nothing})."
              echo "true" > /tmp/ws/cli-published
            else
              echo "Local $LOCAL is not ahead of npm $REMOTE — nothing to publish."
              echo "false" > /tmp/ws/cli-published
            fi
      - run:
          name: Maybe halt (version not ahead)
          command: |
            if [ "$(cat /tmp/ws/cli-published)" = "false" ]; then
              circleci-agent step halt
              exit 0
            fi
      # Secrets only demanded once there is actually something to publish.
      - require-env:
          names: NPM_TOKEN WORKOS_CLIENT_ID NEXT_PUBLIC_CONVEX_URL GITHUB_TOKEN
      - run:
          name: Build CLI (DIRECT — never turbo; real prod env baked in)
          working_directory: apps/cli
          environment:
            SENTRY_CLI_DSN: https://24f72269c7fbd01271c7df8c6bd50744@o4509762173009920.ingest.de.sentry.io/4511055962505296
          command: bun run build
      - run:
          name: Verify WORKOS_CLIENT_ID + NEXT_PUBLIC_CONVEX_URL are embedded
          # A broken build must NEVER reach npm: empty client id breaks auth,
          # empty Convex URL breaks every backend call.
          working_directory: apps/cli
          command: |
            grep -rqF "$WORKOS_CLIENT_ID" dist || { echo "ERROR: WorkOS client id not embedded — refusing to publish."; exit 1; }
            grep -rqF "$NEXT_PUBLIC_CONVEX_URL" dist || { echo "ERROR: Convex URL not embedded — refusing to publish."; exit 1; }
            echo "Embedded prod credentials verified ✓"
      - run:
          name: Pack tarball for the GitHub Release
          working_directory: apps/cli
          command: npm pack && cp ./*.tgz /tmp/ws/
      - run:
          name: Publish to npm
          # --ignore-scripts: prepublishOnly would re-run tsup WITHOUT the
          # embed env, overwriting the verified bundle.
          working_directory: apps/cli
          command: NPM_CONFIG_TOKEN="$NPM_TOKEN" bun publish --ignore-scripts --access public
      - git-push-auth
      - run:
          name: Tag CLI release
          command: |
            TAG="cli-v$(cat /tmp/ws/cli-version)"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists — skipping."
            else
              git tag "$TAG" && git push origin "$TAG"
            fi
      - persist_to_workspace:
          root: /tmp/ws
          paths: [.]

  publish-extension:
    docker:
      - image: cimg/node:22.17
    resource_class: medium
    steps:
      - checkout
      - setup-bun
      - run:
          name: Compare local version against Open VSX
          command: |
            mkdir -p /tmp/ws
            LOCAL=$(jq -r '.version' apps/vscode-extension/package.json)
            echo "$LOCAL" > /tmp/ws/ext-version
            CODE=$(curl -s -o /tmp/ovsx-body -w '%{http_code}' \
              https://open-vsx.org/api/envpilot/envpilot || echo "000")
            case "$CODE" in
              200) REMOTE=$(jq -r '.version // empty' /tmp/ovsx-body) ;;
              404) REMOTE="" ;;
              *) echo "ERROR: Open VSX lookup failed (HTTP $CODE)."; exit 1 ;;
            esac
            if [ -z "$REMOTE" ] || { [ "$LOCAL" != "$REMOTE" ] && [ "$(printf '%s\n%s\n' "$REMOTE" "$LOCAL" | sort -V | tail -1)" = "$LOCAL" ]; }; then
              echo "Publishing $LOCAL (Open VSX has: ${REMOTE:-nothing})."
              echo "true" > /tmp/ws/ext-published
            else
              echo "Local $LOCAL is not ahead of Open VSX $REMOTE — nothing to publish."
              echo "false" > /tmp/ws/ext-published
            fi
      - run:
          name: Maybe halt (version not ahead)
          command: |
            if [ "$(cat /tmp/ws/ext-published)" = "false" ]; then
              circleci-agent step halt
              exit 0
            fi
      - require-env:
          names: OPEN_VSX_TOKEN WORKOS_CLIENT_ID NEXT_PUBLIC_CONVEX_URL GITHUB_TOKEN
      - run:
          name: Package VSIX (real prod env baked at package time)
          # Env MUST be on THIS step: vsce's "vscode:prepublish" re-builds
          # the bundle — earlier dists get wiped. WORKOS_CLIENT_ID and
          # NEXT_PUBLIC_CONVEX_URL here are the REAL prod values from
          # project env vars (the answer to "did you keep those?" — yes).
          working_directory: apps/vscode-extension
          environment:
            ENVPILOT_SERVER_URL: https://www.envpilot.dev
            SENTRY_EXTENSION_DSN: https://24f72269c7fbd01271c7df8c6bd50744@o4509762173009920.ingest.de.sentry.io/4511055962505296
          # Build in THIS shell (env provably present — same pattern as the
          # CLI job), then package with the rebuild skipped via a FILE marker:
          # vsce's spawned npm chain scrubs env on this image, so an env flag
          # (like the secrets themselves) never survives into the prepublish
          # hook — a file on disk always does.
          command: |
            [ -n "$WORKOS_CLIENT_ID" ] || { echo "ERROR: WORKOS_CLIENT_ID empty in step shell"; exit 1; }
            [ -n "$NEXT_PUBLIC_CONVEX_URL" ] || { echo "ERROR: NEXT_PUBLIC_CONVEX_URL empty in step shell"; exit 1; }
            command -v unzip >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq unzip; }
            bun run package
            grep -rqF "$WORKOS_CLIENT_ID" dist || { echo "ERROR: client id missing from dist straight after the step-shell build."; exit 1; }
            grep -rqF "$NEXT_PUBLIC_CONVEX_URL" dist || { echo "ERROR: Convex URL missing from dist straight after the step-shell build."; exit 1; }
            shasum dist/extension.js > /tmp/dist-checksum
            touch .prebuilt
            bunx @vscode/vsce package --no-dependencies
            VSIX="envpilot-$(jq -r '.version' package.json).vsix"
            [ -f "$VSIX" ] || { echo "ERROR: expected package $VSIX not found."; ls ./*.vsix || true; exit 1; }
            unzip -p "$VSIX" extension/dist/extension.js | shasum | awk '{print $1}' > /tmp/vsix-checksum
            [ "$(awk '{print $1}' /tmp/dist-checksum)" = "$(cat /tmp/vsix-checksum)" ] || { echo "ERROR: VSIX bundle differs from the step-shell build — prepublish rebuilt despite the marker."; exit 1; }
            # Embed check by STREAMING the VSIX bundle into grep — never
            # capture it in a shell variable. $(unzip ...) mangles the 500 KB
            # minified bundle (bash drops NUL/binary bytes), so a variable
            # copy is truncated and the grep misses a value that IS in the
            # file — the real cause of every past "client id not in vsix"
            # (the checksum step above uses a pipe, which is why it passed).
            for pair in "WORKOS_CLIENT_ID:$WORKOS_CLIENT_ID" "NEXT_PUBLIC_CONVEX_URL:$NEXT_PUBLIC_CONVEX_URL"; do
              name="${pair%%:*}"; val="${pair#*:}"
              if ! unzip -p "$VSIX" extension/dist/extension.js | grep -qF "$val"; then
                echo "ERROR: $name not in $VSIX — refusing to publish."
                echo "diag: len=${#val} sha8=$(printf '%s' "$val" | shasum | cut -c1-8)"
                echo "diag: dist files containing it:"; grep -rlF "$val" dist || echo "  (none)"
                exit 1
              fi
            done
            cp "$VSIX" /tmp/ws/
            echo "Embedded prod credentials verified in $VSIX ✓"
      - run:
          name: Publish to Open VSX
          working_directory: apps/vscode-extension
          command: bunx ovsx publish envpilot-*.vsix -p "$OPEN_VSX_TOKEN"
      - run:
          name: Publish to VS Code Marketplace (optional, non-blocking)
          working_directory: apps/vscode-extension
          command: |
            if [ -z "${VSCODE_MARKETPLACE_TOKEN:-}" ]; then
              echo "VSCODE_MARKETPLACE_TOKEN not set — skipping Marketplace publish."
              exit 0
            fi
            set +e
            bunx @vscode/vsce publish --no-dependencies \
              --packagePath envpilot-*.vsix -p "$VSCODE_MARKETPLACE_TOKEN"
            [ $? -ne 0 ] && echo "WARNING: Marketplace publish failed (non-blocking; Open VSX succeeded)."
            exit 0
      - git-push-auth
      - run:
          name: Tag extension release
          command: |
            TAG="extension-v$(cat /tmp/ws/ext-version)"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists — skipping."
            else
              git tag "$TAG" && git push origin "$TAG"
            fi
      - persist_to_workspace:
          root: /tmp/ws
          paths: [.]

  publish-action:
    docker:
      - image: cimg/node:22.17
    resource_class: medium
    steps:
      - checkout
      - require-env:
          names: ACTION_PUBLISH_TOKEN
      - setup-bun
      - run:
          name: Build the action bundle (direct)
          working_directory: packages/github-action
          command: bun run build
      - run:
          name: Publish dist to the public envpilot-action repo
          # Only the built surface ships (action.yml, dist, README, LICENSE)
          # — never monorepo source. Exact tag once; floating v1 force-moves.
          command: |
            set -euo pipefail
            WORKSPACE="$PWD"
            VERSION=$(jq -r '.version' packages/github-action/package.json)
            MAJOR="v${VERSION%%.*}"
            git clone "https://x-access-token:${ACTION_PUBLISH_TOKEN}@github.com/rafay99-epic/envpilot-action.git" /tmp/public-action
            cd /tmp/public-action
            git config user.name "envpilot-release-bot"
            git config user.email "hello@envpilot.dev"
            rm -rf dist action.yml README.md LICENSE
            cp -R "$WORKSPACE/packages/github-action/dist" dist
            cp "$WORKSPACE/packages/github-action/action.yml" action.yml
            cp "$WORKSPACE/packages/github-action/README.md" README.md
            cp "$WORKSPACE/packages/github-action/LICENSE" LICENSE
            if git diff --quiet && git diff --cached --quiet && ! git status --porcelain | grep -q .; then
              echo "No content changes to publish."
            else
              git add -A && git commit -m "release: v${VERSION}" && git push origin HEAD
            fi
            if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
              echo "Tag v${VERSION} already exists — skipping."
            else
              git tag "v${VERSION}" && git push origin "v${VERSION}"
            fi
            git tag -f "$MAJOR" && git push -f origin "$MAJOR"
            echo "Published envpilot-action v${VERSION} (${MAJOR} moved)."

  deploy-homebrew:
    docker:
      - image: cimg/node:22.17
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/ws
      - run:
          name: Halt unless the CLI actually published
          command: |
            if [ ! -f /tmp/ws/cli-published ] || [ "$(cat /tmp/ws/cli-published)" != "true" ]; then
              echo "CLI publish skipped this run — no formula update needed."
              circleci-agent step halt
              exit 0
            fi
      - require-env:
          names: HOMEBREW_TAP_PAT
      - run:
          name: Update Formula/envpilot.rb in the public tap
          command: |
            set -euo pipefail
            VERSION=$(cat /tmp/ws/cli-version)
            echo "$VERSION" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+' || { echo "ERROR: invalid version '$VERSION'"; exit 1; }
            git clone "https://github.com/rafay99-epic/homebrew-apps.git" /tmp/homebrew-apps
            cd /tmp/homebrew-apps
            git remote set-url origin "https://x-access-token:${HOMEBREW_TAP_PAT}@github.com/rafay99-epic/homebrew-apps.git"
            git config user.name "envpilot-release-bot"
            git config user.email "hello@envpilot.dev"
            cd -
            apps/cli/scripts/update-homebrew-formula.sh "$VERSION" --tap-dir /tmp/homebrew-apps
            cd /tmp/homebrew-apps
            UNTRACKED=$(git ls-files --others --exclude-standard Formula/)
            if git diff --quiet && git diff --cached --quiet && [ -z "$UNTRACKED" ]; then
              echo "No changes to formula — skipping push."
              exit 0
            fi
            git add Formula/envpilot.rb
            git commit -m "chore: update envpilot to v${VERSION}"
            TAG="envpilot-v${VERSION}"
            git rev-parse "$TAG" >/dev/null 2>&1 || git tag "$TAG"
            git push origin main --tags
            echo "Formula updated to v${VERSION}."

  deploy-web:
    docker:
      - image: cimg/node:22.17
    resource_class: small
    steps:
      - checkout
      - vercel-deploy:
          project-id-var: VERCEL_PROJECT_ID_WEB
          label: web

  deploy-blog:
    docker:
      - image: cimg/node:22.17
    resource_class: small
    steps:
      - checkout
      - vercel-deploy:
          project-id-var: VERCEL_PROJECT_ID_BLOG
          label: blog

  deploy-docs:
    docker:
      - image: cimg/node:22.17
    resource_class: small
    steps:
      - checkout
      - vercel-deploy:
          project-id-var: VERCEL_PROJECT_ID_DOCS
          label: docs

  deploy-admin:
    docker:
      - image: cimg/node:22.17
    resource_class: small
    steps:
      - checkout
      - vercel-deploy:
          project-id-var: VERCEL_PROJECT_ID_ADMIN
          label: admin

  release:
    docker:
      - image: cimg/node:22.17
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/ws
      - require-env:
          names: GITHUB_TOKEN
      - run:
          name: Create GitHub Release (tag, notes, artifacts)
          command: |
            set -euo pipefail
            API="https://api.github.com/repos/rafay99-epic/envpilot.dev"
            AUTH="Authorization: Bearer ${GITHUB_TOKEN}"
            ROOT=$(jq -r '.version' package.json)
            TAG="v${ROOT}"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              TAG="${TAG}+$(git rev-parse --short HEAD)"
            fi
            ver() { jq -r '.version' "$1"; }
            pub() { [ -f "/tmp/ws/$1" ] && cat "/tmp/ws/$1" || echo "unchanged"; }
            status() { case "$(pub "$1")" in true) echo "✅ deployed" ;; false) echo "⏭️ not ahead of registry" ;; *) echo "⏭️ no changes" ;; esac; }
            {
              echo "## Envpilot ${TAG}"
              echo ""
              echo "| Surface | Version | Status |"
              echo "|---------|---------|--------|"
              echo "| Web | $(ver apps/web/package.json) | 🌐 Vercel |"
              echo "| Blog | $(ver apps/blog/package.json) | 🌐 Vercel |"
              echo "| Docs | $(ver apps/docs/package.json) | 🌐 Vercel |"
              echo "| Admin | $(ver apps/admin/package.json) | 🌐 Vercel |"
              echo "| CLI | $(ver apps/cli/package.json) | $(status cli-published) |"
              echo "| Extension | $(ver apps/vscode-extension/package.json) | $(status ext-published) |"
              echo ""
              echo "**Install:** \`npm i -g @envpilot/cli\` · \`brew install rafay99-epic/apps/envpilot\` · [Open VSX](https://open-vsx.org/extension/envpilot/envpilot)"
            } > /tmp/release-body.md
            cat /tmp/release-body.md
            RELEASE=$(jq -cn --arg tag "$TAG" --arg name "Envpilot $TAG" \
              --rawfile body /tmp/release-body.md \
              '{tag_name: $tag, name: $name, body: $body, generate_release_notes: true}')
            RESP=$(curl -sf -X POST -H "$AUTH" -d "$RELEASE" "$API/releases")
            RELEASE_ID=$(echo "$RESP" | jq -r '.id')
            echo "Created release $TAG (id $RELEASE_ID)."
            for f in /tmp/ws/*.tgz /tmp/ws/*.vsix; do
              [ -e "$f" ] || continue
              NAME=$(basename "$f")
              curl -sf -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" \
                --data-binary @"$f" \
                "https://uploads.github.com/repos/rafay99-epic/envpilot.dev/releases/${RELEASE_ID}/assets?name=${NAME}" > /dev/null
              echo "Attached $NAME."
            done
